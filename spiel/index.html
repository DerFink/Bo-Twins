<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1019">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gasballon-Simulator</title>

<!-- Leaflet (Karte); Schriften wie in der Tracker-App -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a1019; --pan:#111b2b; --pan2:#17253b;
  --line:#28395a; --tx:#eef3fa; --mut:#9aabc4;
  --orb:#ff9f1c; --base:#4cc9ff;
  --up:#5fe3a1; --dn:#ff6e5f; --warn:#ffe14d;
  --sand:#d9b36c; --sand2:#a9843f;
  --ui:'Barlow','Segoe UI',system-ui,sans-serif;
  --num:'Barlow Condensed','Arial Narrow','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#04070c;color:var(--tx);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--base);outline-offset:2px}

#app{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.lbl{font-size:12px;color:var(--mut);line-height:1.15}

/* Kopfzeile */
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{min-width:0;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:8px;font-family:var(--num);font-weight:700;font-size:21px;letter-spacing:.02em}
.hrow{display:flex;align-items:center;gap:8px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--pan);display:grid;place-items:center;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 9px;font-size:13px;color:var(--mut);min-height:36px;min-width:38px}
.seg button.on{background:var(--pan2);color:var(--tx);font-weight:600}
#seg-speed button{font-family:var(--num);font-size:16px}
#seg-speed button.on{background:var(--orb);color:#1a1000}
#seg-speed.held button.on{background:var(--pan2);color:var(--tx)}

/* Bühne: Karte und Bedienfeld */
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
main{position:relative;flex:1;min-height:0}
.map{position:absolute;inset:0;z-index:0;background:#0d1626}
.ov{position:absolute;z-index:500}
.card{background:rgba(10,16,25,.9);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px)}
.leaflet-tile.tiles-dark{filter:invert(1) hue-rotate(180deg) saturate(.55) brightness(.93) contrast(.95)}
.leaflet-container{background:#0d1626;font-family:var(--ui)}
.leaflet-control-attribution{background:rgba(10,16,25,.7)!important;color:#8fa2bf!important;font-size:10px}
.leaflet-control-attribution a{color:#b7c8e2!important}
.mk{background:none;border:0}
.ptip{background:rgba(10,16,25,.88);color:#eef3fa;border:0;box-shadow:none;font-size:12px;padding:1px 6px;font-family:var(--ui)}
.ptip::before{display:none}

/* Vertikalprofil */
#prof{left:0;top:0;width:96px;height:62%;padding:0;overflow:hidden;border-left:0;border-top:0;border-radius:0 0 14px 0;cursor:pointer}
#prof.big{width:150px;height:auto;bottom:0;border-radius:0}
#prof canvas{display:block;width:100%;height:100%}

/* Instrumente */
#inst{right:0;top:0;width:104px;padding:5px 7px 6px 8px;border-right:0;border-top:0;border-radius:0 0 0 14px}
#i-agl{font-size:30px;font-weight:700;line-height:1;white-space:nowrap}
#i-agl small{font-size:13px;font-weight:600;color:var(--mut);margin-left:2px}
#i-nn{font-size:12.5px;color:var(--mut);margin:0 0 3px;white-space:nowrap}
#inst .lbl{font-size:11px}
#inst .kv{gap:4px;padding:.5px 0}
#inst .kv span{font-size:11px}
#inst .kv b{font-size:14px}
#inst{overflow:hidden}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:1.5px 0}
.kv span{font-size:12px;color:var(--mut);white-space:nowrap}
.kv b{font-family:var(--num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
#inst #i-vario{font-size:17px}

#hint{left:8px;right:8px;bottom:74px;padding:8px 10px;font-size:13px;line-height:1.3;text-align:center}
#follow{right:8px;bottom:26px;min-height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--orb);background:var(--orb);color:#1a1000;font-weight:600;font-size:14px}
#result{left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,calc(100% - 24px));padding:14px 14px 12px;z-index:700}
#result h2{margin:0 0 8px;font-family:var(--num);font-size:24px;letter-spacing:.02em}
.pri{width:100%;min-height:44px;margin-top:10px;border-radius:12px;border:1px solid var(--orb);background:var(--orb);color:#1a1000;font-weight:600;font-size:15px}

/* Bedienfeld: Sandsäcke, Sandmulde, Ventil */
.panel{touch-action:manipulation;flex:none;display:grid;grid-template-columns:1.3fr 1fr 56px;gap:6px;padding:6px 6px max(6px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);user-select:none;-webkit-user-select:none}
.box{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--pan);padding:4px 6px 6px;display:flex;flex-direction:column;min-width:0}
.box h3{margin:0;font-size:11.5px;font-weight:500;color:var(--mut);display:flex;justify-content:space-between;align-items:baseline;gap:4px;white-space:nowrap}
.box h3 b{font-family:var(--num);font-size:15px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
#rack{flex:1;margin-top:3px;border:1px dashed var(--line);border-radius:8px;background:none;padding:5px 4px 4px;display:flex;flex-wrap:wrap;align-content:flex-end;gap:4px 2px;min-height:40px;text-align:left}
#rack:active{border-color:var(--orb)}
#rack:disabled{opacity:.45}
.sack{width:10px;height:12px;border-radius:4px 4px 5px 5px;background:linear-gradient(160deg,var(--sand),var(--sand2));position:relative;flex:none}
.sack::before{content:"";position:absolute;left:3px;right:3px;top:-2px;height:3px;border-radius:2px 2px 0 0;background:var(--sand2)}
.more{font-family:var(--num);font-size:13px;color:var(--mut);align-self:center;padding-left:3px}

#trough{position:relative;flex:1;margin-top:3px;border:2px solid #5d6f8f;border-top:0;border-radius:0 0 10px 10px;overflow:hidden;min-height:30px;background:#0d1626}
#sandfill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,var(--sand),var(--sand2));transition:height .25s}
#trough b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;white-space:nowrap;font-family:var(--num);font-size:17px;font-weight:700;text-shadow:0 1px 3px #000,0 0 8px #000}
#scoop{white-space:nowrap;padding:0 2px;margin-top:4px;min-height:34px;border-radius:10px;border:1px solid var(--sand2);background:#3a2f18;font-weight:600;font-size:12px;touch-action:none}
#scoop:active{background:#5a4a25}
#scoop:disabled{opacity:.45}
#valve{flex:1;position:relative;margin:3px auto 0;width:42px;min-height:62px;touch-action:none;cursor:grab}
#valve::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:#2c3f60}
#vline{position:absolute;left:50%;top:0;width:2px;margin-left:-1px;height:0;background:var(--tx)}
#vknob{position:absolute;left:50%;top:0;width:38px;height:24px;margin-left:-19px;border-radius:8px;border:2px solid var(--dn);background:#3a1614;display:grid;place-items:center;font-family:var(--num);font-size:13px;font-weight:600}
#valve.rel #vknob,#valve.rel #vline{transition:top .18s,height .18s}
.flash{position:absolute;right:8px;top:26px;font-family:var(--num);font-size:18px;font-weight:700;color:var(--up);pointer-events:none;animation:fl 1s ease-out forwards}
@keyframes fl{to{transform:translateY(-26px);opacity:0}}

/* Einstellungen */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:900;max-height:88%;overflow:auto;background:#0d1626;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.5);padding:12px 12px max(20px,env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.sheet h2{margin:0;font-family:var(--num);font-size:22px}
.sheet h4{margin:16px 0 6px;font-size:14px;font-weight:600}
.shead{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.row input{width:104px;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--pan);padding:0 10px;font-family:var(--num);font-size:18px;text-align:right}
.sm{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--pan2);font-size:13px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:12.5px;color:var(--mut);line-height:1.4;margin:6px 0 0}
#cfg-calc{margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--pan)}
#cfg-calc.bad{border-color:var(--dn)}

#startwin{position:absolute;inset:0;z-index:800;display:grid;place-items:center;padding:12px;background:rgba(4,7,12,.62)}
#startwin .card{width:min(360px,100%);max-height:100%;overflow:auto;padding:14px 14px 12px;background:#0d1626}
#startwin h2{margin:0 0 8px;font-family:var(--num);font-size:26px;letter-spacing:.02em}
.brief{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:14px;line-height:1.3}
.brief dt{color:var(--mut);font-size:12.5px;padding-top:1px}
.brief dd{margin:0}
#startwin .note{margin-top:10px}
.sec{width:100%;min-height:40px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--pan2);font-weight:600;font-size:14px}
#toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-12px);z-index:2600;padding:9px 14px;border-radius:12px;background:#10243d;border:1px solid var(--line);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100% - 24px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Handy quer: Bedienfeld rechts neben der Karte */
@media (orientation:landscape) and (max-height:560px){
  .stage{flex-direction:row}
  .panel{width:290px;border-top:0;border-left:1px solid var(--line);align-content:stretch}
  #prof{height:auto;bottom:0;border-radius:0}
  #hint{left:104px;right:112px;top:8px;bottom:auto}
  #scoop{font-size:11px}
}
@media (max-width:400px){.brand span{display:none}}
@media (prefers-reduced-motion:reduce){.sheet,#toast,#sandfill{transition:none}.flash{animation-duration:.01s}}

/* Sprachwahl mit Flaggen in der Kopfzeile */
.langdd{position:relative;flex:none}
#lang-btn{display:flex;align-items:center;gap:4px;min-height:38px;padding:0 7px;border-radius:12px;border:1px solid var(--line);background:var(--pan)}
#lang-btn .chev{color:var(--mut)}
.flag{flex:none;border-radius:3px;outline:1px solid rgba(255,255,255,.28)}
.langlist{position:absolute;left:0;top:calc(100% + 4px);z-index:3000;width:190px;max-height:min(380px,70vh);overflow:auto;background:#0d1626;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.lopt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:8px;background:transparent;color:var(--tx);font-size:14px;text-align:left}
.lopt.on{background:var(--pan2);font-weight:600}
.lopt.on::after{content:"\2713";margin-left:auto;color:#ffc83d}
#app.inmenu #seg-speed{visibility:hidden}

/* Fenster über der Bühne: Hauptmenü, Vorbereitung, Startfenster, Rückfrage */
.stage{position:relative}
.full{position:absolute;inset:0;z-index:800;display:grid;place-items:center;padding:12px;background:rgba(4,7,12,.62)}
.full>.card{width:min(360px,100%);max-height:100%;overflow:auto;padding:14px 14px 12px;background:#0d1626}
.full h2{margin:0 0 8px;font-family:var(--num);font-size:26px;letter-spacing:.02em}
.full h4{margin:14px 0 6px;font-size:14px;font-weight:600}
.full .note{margin-top:8px}
#confirm{z-index:1000}
#confirm p{margin:0 0 4px;font-size:15px;line-height:1.4}
#busy{z-index:860}
#busy .card{width:auto;padding:14px 18px;font-weight:600}
.seg.wide{display:flex}
.seg.wide button{flex:1;min-height:40px}
.task{border:1px solid var(--orb);border-radius:12px;background:var(--pan);padding:8px 10px}
.task b{display:block;font-size:15px}
.task span{display:block;font-size:12.5px;color:var(--mut);line-height:1.35;margin-top:2px}
#menu{z-index:850;padding:0;background:#352879}
#c64{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.mcard{position:relative;width:min(340px,calc(100% - 28px));max-height:calc(100% - 16px);overflow:auto;padding:12px;background:rgba(10,16,25,.9);border:3px solid #6C5EB5;border-radius:4px}
.mcard h1{margin:0 0 4px;font-family:"Courier New",Courier,monospace;font-size:21px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:#B8C76F}
.mbtn{display:block;width:100%;text-align:left;margin-top:8px;padding:8px 11px;border-radius:4px;border:2px solid #6C5EB5;background:#17253b}
.mbtn b{display:block;font-size:17px;font-weight:600}
.mbtn span{display:block;font-size:12.5px;color:var(--mut);line-height:1.3;margin-top:1px}
.mbtn em{float:right;font-style:normal;font-size:11px;color:#B8C76F;border:1px solid #B8C76F;border-radius:8px;padding:1px 7px;margin-left:8px}
.mbtn:disabled{opacity:.6;cursor:default}
.mbtn:not(:disabled):active{background:#22355a}
#result .big b{font-size:30px;color:var(--orb)}
#result{max-height:calc(100% - 16px);overflow:auto}
#result .sec{margin-top:6px}
</style>
</head>

<body>
<div id="app" class="inmenu">

  <header class="hdr">
    <div class="hrow" style="min-width:0">
      <div class="brand">
        <svg width="22" height="28" viewBox="0 0 44 54" aria-hidden="true"><path d="M22 2C11 2 4 10 4 20c0 8 6 14.5 13 19h10c7-4.5 13-11 13-19C40 10 33 2 22 2z" fill="#ff9f1c"/><path d="M17 39l3 6M27 39l-3 6" stroke="#eef3fa" stroke-width="2"/><rect x="18" y="45" width="8" height="6" rx="1.5" fill="#eef3fa"/></svg>
        <span data-i="brand">Gasballon</span>
      </div>
      <div class="langdd" id="lang-sel">
        <button type="button" id="lang-btn" aria-haspopup="listbox" aria-expanded="false" data-ia="lang" aria-label="Sprache"></button>
        <div class="langlist" id="lang-list" role="listbox" hidden></div>
      </div>
    </div>
    <div class="hrow">
      <div class="seg" id="seg-speed" role="group" data-ia="speed" aria-label="Zeitraffer">
        <button data-v="1" class="on">1×</button><button data-v="5">5×</button><button data-v="10">10×</button><button data-v="30">30×</button>
      </div>
      <button id="btn-set" class="iconbtn" data-ia="settings" aria-label="Einstellungen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <div class="stage">
    <main>
      <div id="map" class="map"></div>

      <div class="ov card" id="prof"><canvas id="prof-cv" role="img" data-ia="prof_hint" aria-label="Vertikalprofil"></canvas></div>

      <div class="ov card" id="inst">
        <div class="lbl" data-i="agl">über Grund</div>
        <div class="num" id="i-agl">0<small>m</small></div>
        <div class="num" id="i-nn">NN –</div>
        <div class="kv"><span>m/s</span><b id="i-vario">0,0</b></div>
        <div class="kv"><span data-i="track">Fahrt</span><b id="i-track">–</b></div>
        <div class="kv tgt" hidden><span data-i="tgt">Ziel</span><b id="i-tdist">–</b></div>
        <div class="kv tgt" hidden><span>→</span><b id="i-tbrg">–</b></div>
        <div class="kv"><span data-i="time">Zeit</span><b id="i-time">0:00:00</b></div>
        <div class="kv"><span data-i="dist">Weg</span><b id="i-dist">0 m</b></div>
        <div class="kv"><span data-i="sand">Sand</span><b id="n-total">–</b></div>
        <div class="kv"><span data-i="fill">Gas</span><b id="i-fill">100 %</b></div>
        <div class="kv gasaid" hidden><span>m³</span><b id="i-gas">–</b></div>
        <div class="kv gasaid" hidden><span>ΔT K</span><b id="i-gast">–</b></div>
      </div>

      <div class="ov card" id="hint" hidden></div>
      <button class="ov" id="follow" hidden data-i="follow">Ballon folgen</button>

      <div class="ov card" id="result" hidden>
        <h2 data-i="landed">Gelandet</h2>
        <div class="kv tgtres big" hidden><span data-i="r_pts">Punkte</span><b id="r-pts">–</b></div>
        <div class="kv tgtres" hidden><span data-i="r_tdist">Abstand zum Ziel</span><b id="r-tdist">–</b></div>
        <div class="kv"><span data-i="r_sink">Sinken beim Aufsetzen</span><b id="r-sink">–</b></div>
        <div class="kv"><span data-i="r_time">Fahrzeit</span><b id="r-time">–</b></div>
        <div class="kv"><span data-i="r_dist">Strecke</span><b id="r-dist">–</b></div>
        <div class="kv"><span data-i="r_line">Luftlinie vom Start</span><b id="r-line">–</b></div>
        <div class="kv"><span data-i="r_max">Größte Höhe</span><b id="r-max">–</b></div>
        <div class="kv"><span data-i="r_sand">Sand übrig</span><b id="r-sand">–</b></div>
        <div class="kv"><span data-i="r_gas">Traggas übrig</span><b id="r-gas">–</b></div>
        <p class="note tgtres" hidden data-i="r_best"></p>
        <button class="pri" id="again" data-i="again">Neue Fahrt</button>
        <button class="sec" id="r-menu" data-i="menu">Hauptmenü</button>
      </div>
    </main>

    <div class="panel">
      <div class="box" id="box-sacks">
        <h3><span data-i="sacks">Sandsäcke</span><b id="n-sacks">–</b></h3>
        <button id="rack" data-ia="drop_sack" aria-label="Sandsack abwerfen"></button>
      </div>
      <div class="box" id="box-trough">
        <h3><span data-i="trough">Sandmulde</span></h3>
        <div id="trough"><div id="sandfill"></div><b id="n-trough">–</b></div>
        <button id="scoop" data-i="scoop">Schaufel 100 g</button>
      </div>
      <div class="box" id="box-valve">
        <h3><span data-i="valve">Ventil</span></h3>
        <div id="valve" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0" data-ia="valve_a" aria-label="Ventilleine ziehen"><div id="vline"></div><div id="vknob">0</div></div>
      </div>
    </div>

    <!-- Hauptmenü mit bewegtem Hintergrund im Stil der Heimcomputer der 80er -->
    <div class="full" id="menu">
      <canvas id="c64" aria-hidden="true"></canvas>
      <div class="mcard">
        <h1 data-i="brand">Gasballon</h1>
        <button class="mbtn" id="m-free"><b data-i="m_free"></b><span data-i="m_free_d"></span></button>
        <button class="mbtn" id="m-chal"><b data-i="m_chal"></b><span data-i="m_chal_d"></span></button>
        <button class="mbtn" disabled><em data-i="soon"></em><b data-i="m_comp"></b><span data-i="m_comp_d"></span></button>
        <button class="mbtn" disabled><em data-i="soon"></em><b data-i="m_champ"></b><span data-i="m_champ_d"></span></button>

<script>
/* =====================================================================
   Gasballon-Simulator
   Physik-Kern ohne Bezug zur Oberfläche, damit er sich einzeln prüfen lässt.
   ===================================================================== */
/*CORE-START*/
const R_GAS = 8.314462;      // J/(mol·K)
const M_AIR = 0.028964;      // kg/mol, trockene Luft
const M_H2  = 0.002016;      // kg/mol, Wasserstoff
const G0    = 9.80665;       // m/s²
const CP_H2 = 28.83;         // J/(mol·K), Wärmekapazität von Wasserstoff bei konstantem Druck
const KAPPA = R_GAS / CP_H2; // 0,288: Exponent der adiabatischen Zustandsänderung des Traggases
const SIGMA = 5.670374e-8;   // W/(m²·K⁴), Stefan-Boltzmann-Konstante
const PR    = 0.71;          // Prandtl-Zahl, für Luft und Wasserstoff nahezu gleich
// Stoffwerte, Potenzansätze um 273 K: Wärmeleitfähigkeit W/(m·K) und dynamische Viskosität Pa·s
const kAir = T => 0.0241 * Math.pow(T / 273.15, 0.82), muAir = T => 1.716e-5 * Math.pow(T / 273.15, 0.70);
const kH2  = T => 0.168  * Math.pow(T / 273.15, 0.78), muH2  = T => 8.40e-6  * Math.pow(T / 273.15, 0.69);

const DEFAULT_CFG = {
  vol: 1000,       // Hüllenvolumen in m³ (STE-09)
  rust: 200,       // Rüstmasse in kg: Korb und Ballon, Hülle eingeschlossen (Vorgabe Nutzer, STE-09)
  equip: 30,       // Ausrüstung in kg (Vorgabe Nutzer)
  envKg: 135,      // Masse der Hülle in kg, Teil der Rüstmasse; bestimmt ihre Wärmekapazität (Vorgabe Nutzer)
  pax: 4,          // Personen (STE-10)
  paxKg: 80,       // Masse je Person in kg (STE-10)
  sackKg: 15,      // Masse je Sandsack (STE-13)
  scoopKg: 0.1,    // Masse je Schaufel (STE-14)
  cw: 0.45,        // Widerstandsbeiwert der Hülle, Kugel (Annahme, OP-16)
  envC: 1400,      // J/(kg·K), Wärmekapazität des Hüllenstoffs (Annahme)
  envEps: 0.85,    // Emissionsgrad der Hülle im Infraroten (Annahme)
  valveD: 1.0,     // m, Durchmesser des Parachute-Ventils im Scheitel der Hülle (Vorgabe Nutzer)
  valveCd: 1.0     // Ausflusszahl des voll geöffneten Ventils (Annahme, OP-16)
};

/* Simulierte Atmosphäre (OP-18, vorläufig fest): Bodenwerte, Temperaturschichten mit Inversion, Wind dreht mit der Höhe.
   Höhen in m über Grund. */
const SIM_WX = {
  p0: 101600, T0: 12,
  layers: [[500,-0.0080],[650,0.0130],[2000,-0.0060],[2150,0.0010],[1e5,-0.0065]],   // [Obergrenze, Gradient K/m]
  wind: [[0,200,2.5],[300,215,4],[600,240,5.5],[1000,265,6],[1500,280,7.5],[2000,300,9],[3000,310,12],[5000,320,18],[10000,320,25]]   // [Höhe, Richtung aus °, m/s]
};
const DZ = 25, ZTOP = 10000;

function buildAtm(wx){
  const tab = [];
  let T = wx.T0 + 273.15, p = wx.p0, li = 0, wi = 0;
  for (let z = 0; z <= ZTOP; z += DZ){
    while (wi < wx.wind.length - 2 && wx.wind[wi+1][0] < z) wi++;
    const a = wx.wind[wi], b = wx.wind[wi+1], f = Math.min(1, Math.max(0, (z - a[0]) / (b[0] - a[0])));
    const uv = k => { const d = k[1] * Math.PI / 180; return [-k[2] * Math.sin(d), -k[2] * Math.cos(d)]; };
    const A = uv(a), B = uv(b);
    tab.push({T, p, u: A[0] + (B[0] - A[0]) * f, v: A[1] + (B[1] - A[1]) * f});
    while (wx.layers[li][0] <= z) li++;
    const T2 = T + wx.layers[li][1] * DZ;
    p *= Math.exp(-G0 * M_AIR * DZ / (R_GAS * (T + T2) / 2));   // hydrostatisch
    T = T2;
  }
  return tab;
}
function atmAt(tab, h){
  const x = Math.min(Math.max(h, 0), ZTOP - 0.001) / DZ, i = Math.floor(x), f = x - i, a = tab[i], b = tab[i+1];
  return {T: a.T + (b.T - a.T) * f, p: a.p + (b.p - a.p) * f, u: a.u + (b.u - a.u) * f, v: a.v + (b.v - a.v) * f};
}

const fixedKg = cfg => cfg.rust + cfg.equip + cfg.pax * cfg.paxKg;   // alles außer Sand und Gas

/* Beladung beim Start (STE-11 bis STE-14, OP-15): Hülle voll, gerade so viel Sand, dass der Ballon steht. */
function loadout(cfg, tab){
  const a = atmAt(tab, 0);
  const n = a.p * cfg.vol / (R_GAS * a.T);              // mol Traggas in der vollen Hülle
  const lift = n * (M_AIR - M_H2);                      // kg: verdrängte Luft minus Gas
  const trim = lift - fixedKg(cfg);                     // kg Trimmballast
  const sU = Math.round(cfg.sackKg * 10);               // Sack in 100-g-Einheiten
  if (trim < 0) return {ok: false, n, lift, trim, sacks: 0, mU: 0};
  let full = Math.floor(trim / cfg.sackKg + 1e-9);
  let restU = Math.round((trim - full * cfg.sackKg) * 10);
  if (restU >= sU){ full++; restU -= sU; }
  // ein Sack liegt beim Start in der Sandmulde (vom Nutzer bestätigt)
  return {ok: true, n, lift, trim, sacks: Math.max(full - 1, 0), mU: (full >= 1 ? sU : 0) + restU};
}
function newBalloon(cfg, tab){
  const Lo = loadout(cfg, tab), a = atmAt(tab, 0);
  return {ok: Lo.ok, h: 0, w: 0, e: 0, n: 0, t: 0, dist: 0, maxH: 0, gas: Lo.n, gas0: Lo.n, Tg: a.T, Tf: a.T,
          sacks: Lo.sacks, mU: Lo.mU, air: false, landed: false, vLand: 0, free: 0, full: true, lift: Lo.lift, trim: Lo.trim};
}
const sandKg = (B, cfg) => B.sacks * cfg.sackKg + B.mU / 10;
/* Nachfüllen (STE-15): weniger als ein Sack in der Mulde und mehr als ein Sack übrig */
function refill(B, cfg){
  const sU = Math.round(cfg.sackKg * 10);
  if (B.mU < sU && B.sacks > 1){ B.sacks--; B.mU += sU; return true; }
  return false;
}
function dropSack(B, cfg){ if (B.landed || B.sacks < 1) return false; B.sacks--; refill(B, cfg); return true; }
function dropScoop(B, cfg){ if (B.landed || B.mU < 1) return false; B.mU -= Math.round(cfg.scoopKg * 10); if (B.mU < 0) B.mU = 0; refill(B, cfg); return true; }

/* Wärmehaushalt des Traggases (STE-19), zwei Knoten: Gas und Hülle.
   Gas ↔ Hülle: freie Konvektion im Inneren, turbulent, Nu = 0,13·Ra^(1/3) (McAdams; für Ballone bei Kreith und Kreider 1974).
   Hülle ↔ Luft: freie Konvektion an der Kugel (Churchill 1983) und erzwungene Konvektion (Whitaker 1972, hier über den
   belegten Bereich hinaus verwendet); angeströmt wird der Ballon nur mit seiner Steig- oder Sinkgeschwindigkeit,
   weil er waagerecht mit dem Wind treibt. Dazu Wärmestrahlung der Hülle; die Umgebung strahlt vereinfacht mit Lufttemperatur.
   Sonneneinstrahlung ist nicht berücksichtigt. Das Gas gilt als durchmischt. */
function heatExchange(B, cfg, a, V, dt){
  if (V <= 0 || B.gas <= 0) return;
  const D = Math.cbrt(6 * V / Math.PI), A = Math.PI * D * D;
  // innen
  const Tgi = (B.Tg + B.Tf) / 2, rhoG = B.gas * M_H2 / V, nuG = muH2(Tgi) / rhoG, alG = kH2(Tgi) / (rhoG * CP_H2 / M_H2);
  const RaI = G0 * Math.abs(B.Tg - B.Tf) / Tgi * D * D * D / (nuG * alG);
  const hI = Math.max(1, 0.13 * Math.cbrt(RaI)) * kH2(Tgi) / D;
  // außen
  const Tfa = (B.Tf + a.T) / 2, rhoA = a.p * M_AIR / (R_GAS * Tfa), nuA = muAir(Tfa) / rhoA, alA = nuA / PR;
  const RaE = G0 * Math.abs(B.Tf - a.T) / Tfa * D * D * D / (nuA * alA);
  const nuFree = 2 + 0.589 * Math.pow(RaE, 0.25) / Math.pow(1 + Math.pow(0.469 / PR, 9 / 16), 4 / 9);
  const Re = Math.abs(B.w) * D / nuA;
  const nuForced = 2 + (0.4 * Math.sqrt(Re) + 0.06 * Math.pow(Re, 2 / 3)) * Math.pow(PR, 0.4);
  const hE = Math.cbrt(nuFree * nuFree * nuFree + nuForced * nuForced * nuForced) * kAir(Tfa) / D;
  const hR = 4 * cfg.envEps * SIGMA * Tfa * Tfa * Tfa;
  const qGas = hI * A * (B.Tf - B.Tg);                 // W, Hülle an Gas
  const qEnv = (hE + hR) * A * (a.T - B.Tf) - qGas;    // W, Umgebung an Hülle abzüglich der Abgabe ans Gas
  B.Tg += qGas * dt / (B.gas * CP_H2);
  B.Tf += qEnv * dt / (Math.max(10, Math.min(cfg.envKg, cfg.rust)) * cfg.envC);
  B.hI = hI; B.hE = hE; B.hR = hR;
}

/* Ein Zeitschritt. valve = 0 bis 1 (wie weit die Ventilleine gezogen ist). */
function stepBalloon(B, cfg, tab, dt, valve){
  if (B.landed || !B.ok) return;
  const a = atmAt(tab, B.h);
  if (valve > 0 && B.gas > 0){
    // Parachute-Ventil im Scheitel: Das Gas strömt durch die Öffnung aus, getrieben vom Überdruck der Gassäule
    // Δp = (ρ_Luft − ρ_Gas)·g·h, Ausströmgeschwindigkeit √(2·Δp/ρ_Gas); die offene Fläche wächst proportional zum Zug
    const rhoG = a.p * M_H2 / (R_GAS * B.Tg), rhoA = a.p * M_AIR / (R_GAS * a.T);
    const hGas = Math.cbrt(6 * Math.min(B.gas * R_GAS * B.Tg / a.p, cfg.vol) / Math.PI);        // Höhe der Gassäule, als Kugel genähert
    const q = cfg.valveCd * valve * Math.PI * cfg.valveD * cfg.valveD / 4 * Math.sqrt(2 * Math.max(0, rhoA - rhoG) * G0 * hGas / rhoG);   // m³/s
    B.gas = Math.max(0, B.gas - q * dt * a.p / (R_GAS * B.Tg));
  }
  let V = B.gas * R_GAS * B.Tg / a.p;
  B.full = V >= cfg.vol;
  if (B.full){ B.gas = a.p * cfg.vol / (R_GAS * B.Tg); V = cfg.vol; }      // pralle Hülle: Überschuss entweicht (STE-05)
  const rho = a.p * M_AIR / (R_GAS * a.T);
  const load = fixedKg(cfg) + sandKg(B, cfg);
  const free = rho * V - B.gas * M_H2 - load;                              // kg Auftriebsüberschuss
  B.free = free;
  if (B.h <= 0 && free <= 0.06){ B.w = 0; B.h = 0; B.Tg = B.Tf = a.T; return; }   // steht am Boden
  const area = Math.PI * Math.pow(3 * cfg.vol / (4 * Math.PI), 2 / 3);
  const k = 0.5 * rho * cfg.cw * area;
  const mEff = load + B.gas * M_H2 + 0.5 * rho * V;                        // mit mitbewegter Luft
  B.w += (G0 * free - k * B.w * Math.abs(B.w)) / mEff * dt;
  let h2 = B.h + B.w * dt;
  B.e += a.u * dt; B.n += a.v * dt; B.dist += Math.hypot(a.u, a.v) * dt; B.t += dt;
  if (h2 <= 0){
    h2 = 0;
    if (B.air){ B.landed = true; B.vLand = -B.w; }
    B.w = 0;
  }
  const a2 = atmAt(tab, h2);
  B.Tg *= Math.pow(a2.p / a.p, KAPPA);                                     // Gas dehnt sich adiabatisch aus oder wird verdichtet
  heatExchange(B, cfg, a2, V, dt);                                         // Wärmeaustausch Gas, Hülle, Umgebung
  B.h = h2;
  if (B.h > B.maxH) B.maxH = B.h;
  if (B.h > 10) B.air = true;
}

/* ---------- Wettermodell: Open-Meteo, Druckflächen und Bodenwerte für den Startort (MET-01) ---------- */
const WX_LEVELS = [1000, 975, 950, 925, 900, 850, 800, 700, 600, 500, 400, 300, 250];
function wxUrl(lat, lon){
  const h = ['temperature_2m', 'wind_speed_10m', 'wind_direction_10m', 'surface_pressure'];
  WX_LEVELS.forEach(L => ['temperature', 'wind_speed', 'wind_direction', 'geopotential_height'].forEach(v => h.push(v + '_' + L + 'hPa')));
  return 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(4) + '&longitude=' + lon.toFixed(4) + '&hourly=' + h.join(',') + '&wind_speed_unit=ms&timezone=UTC&forecast_days=2';
}
const windUV = (spd, dir) => [-spd * Math.sin(dir * Math.PI / 180), -spd * Math.cos(dir * Math.PI / 180)];
/* Antwort auswerten: Stunde, die der Uhrzeit am nächsten liegt. Ergebnis: Stützstellen über Grund. */
function wxParse(j, nowMs){
  try{
    const H = j.hourly, elev = +j.elevation || 0, tt = H.time.map(t => Date.parse(t + 'Z'));
    let k = 0; tt.forEach((t, i) => { if (Math.abs(t - nowMs) < Math.abs(tt[k] - nowMs)) k = i; });
    const g = n => (H[n] && H[n][k] != null) ? +H[n][k] : null, pts = [];
    if (g('temperature_2m') != null && g('wind_speed_10m') != null){ const uv = windUV(g('wind_speed_10m'), g('wind_direction_10m') || 0); pts.push({h: 0, T: g('temperature_2m') + 273.15, u: uv[0], v: uv[1]}); }
    WX_LEVELS.forEach(L => {
      const z = g('geopotential_height_' + L + 'hPa'), T = g('temperature_' + L + 'hPa'), s = g('wind_speed_' + L + 'hPa'), d = g('wind_direction_' + L + 'hPa');
      if (z != null && T != null && s != null && d != null && z > elev + 40){ const uv = windUV(s, d); pts.push({h: z - elev, T: T + 273.15, u: uv[0], v: uv[1], pl: L * 100}); }   // Flächen unter dem Boden weglassen
    });
    pts.sort((a, b) => a.h - b.h);
    if (pts.length < 4 || pts[0].h !== 0) return null;
    let p0 = g('surface_pressure'); p0 = p0 != null ? p0 * 100 : null;
    if (p0 == null){ const q = pts.find(x => x.pl); p0 = q.pl * Math.exp(G0 * M_AIR * q.h / (R_GAS * (pts[0].T + q.T) / 2)); }   // ersatzweise aus der untersten Druckfläche
    return {valid: tt[k], elev, p0, pts};
  }catch(e){ return null; }
}
/* Tabelle der Atmosphäre aus Stützstellen: Temperatur und Wind linear, Druck hydrostatisch vom Bodendruck aus. */
function buildAtmFromPoints(m){
  const tab = [], P = m.pts; let p = m.p0, i = 0, Tprev = null;
  for (let z = 0; z <= ZTOP; z += DZ){
    while (i < P.length - 2 && P[i + 1].h < z) i++;
    const a = P[i], b = P[i + 1]; let T, u, v;
    if (z <= b.h){ const f = (z - a.h) / (b.h - a.h); T = a.T + (b.T - a.T) * f; u = a.u + (b.u - a.u) * f; v = a.v + (b.v - a.v) * f; }
    else { T = Math.max(216.65, b.T - 0.0065 * (z - b.h)); u = b.u; v = b.v; }                                 // über der obersten Fläche: Normgradient, Wind gleichbleibend
    if (Tprev != null) p *= Math.exp(-G0 * M_AIR * DZ / (R_GAS * (T + Tprev) / 2));
    tab.push({T, p, u, v}); Tprev = T;
  }
  return tab;
}

/* ---------- Selbststeuerung: hält eine Sollhöhe mit Sand und Ventil. Für die Zielberechnung und den Vergleichsweg. ---------- */
function dropKg(B, cfg, kg){
  let n = 0; while (kg - n * cfg.sackKg >= cfg.sackKg && B.sacks > 1){ B.sacks--; n++; }
  let u = Math.round((kg - n * cfg.sackKg) * 10);
  while (u > 0){ if (B.mU < 1){ if (B.sacks > 0){ B.sacks--; u -= Math.round(cfg.sackKg * 10); continue; } break; } const d = Math.min(u, B.mU); B.mU -= d; u -= d; refill(B, cfg); }
}
function autopilot(B, cfg, tab, hSoll){
  const a = atmAt(tab, B.h), rho = a.p * M_AIR / (R_GAS * a.T);
  const k = 0.5 * rho * cfg.cw * Math.PI * Math.pow(3 * cfg.vol / (4 * Math.PI), 2 / 3);
  let wSoll;
  if (hSoll <= 0) wSoll = B.h > 200 ? -2 : -(0.5 + 1.5 * B.h / 200);              // Abstieg, kurz vor dem Boden abfangen
  else wSoll = Math.max(-2, Math.min(2.5, (hSoll - B.h) / 60));
  const need = k * wSoll * Math.abs(wSoll) / G0 - B.free;                         // kg, die am Auftriebsüberschuss fehlen (+) oder zu viel sind (−)
  if (B.h <= 0 && !B.air && hSoll > 0){ dropKg(B, cfg, Math.max(need, 2)); return; }
  if (need > 1.2) dropKg(B, cfg, need);
  else if (need < -1.2) B.gas = Math.max(0, B.gas + need / (M_AIR * B.Tg / a.T - M_H2));   // Gas ablassen
}
/* Eine Fahrt nach Plan durchrechnen: legs = [{h, dur}] (Höhe über Grund in m, Dauer in s), danach Landung. */
function planFlight(cfg, tab, legs){
  const B = newBalloon(cfg, tab), path = [[0, 0, 0]]; if (!B.ok) return {ok: false};
  const sand0 = sandKg(B, cfg); let leg = 0, tEnd = legs[0].dur;
  for (let t = 0; t < 4 * 3600 && !B.landed; t++){
    if (leg < legs.length && t >= tEnd){ leg++; if (leg < legs.length) tEnd += legs[leg].dur; }
    if (t % 10 === 0) autopilot(B, cfg, tab, leg < legs.length ? legs[leg].h : 0);
    stepBalloon(B, cfg, tab, 1, 0);
    if (t % 60 === 59) path.push([B.e, B.n, B.h]);
  }
  path.push([B.e, B.n, 0]);
  return {ok: B.landed, e: B.e, n: B.n, t: B.t, vLand: B.vLand, maxH: B.maxH, sandLeft: sandKg(B, cfg), sand0, gasLeft: B.gas / B.gas0, path};
}
const windDirTo = (tab, h) => { const a = atmAt(tab, h); return (Math.atan2(a.u, a.v) * 180 / Math.PI + 360) % 360; };
const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
/* Ziel für die Aufgabe Ziellanden: Fahrten mit zufälligen Höhenplänen rechnen, eine Landung in 1 bis 2 Stunden wird das Ziel.
   level: 0 einfach (eine Höhe), 1 mittel (ein Wechsel der Höhe), 2 schwer (hohe Schicht mit anderer Windrichtung). */
function makeTarget(cfg, tab, level, rnd){
  rnd = rnd || Math.random;
  const pick = arr => arr[Math.floor(rnd() * arr.length)], span = (a, b) => a + rnd() * (b - a);
  const low = [300, 400, 500, 600, 800, 1000], high = [1500, 1800, 2200, 2600, 3000];
  let best = null, lowShear = false;
  // größte Richtungsänderung, die das Profil hergibt
  let maxLo = 0, maxHi = 0;
  for (const a of low) for (const b of low) maxLo = Math.max(maxLo, angDiff(windDirTo(tab, a), windDirTo(tab, b)));
  for (const a of low) for (const b of high) maxHi = Math.max(maxHi, angDiff(windDirTo(tab, a), windDirTo(tab, b)));
  const needMid = Math.min(25, maxLo * 0.7), needHi = Math.min(45, maxHi * 0.7);
  if ((level === 1 && maxLo < 15) || (level === 2 && maxHi < 25)) lowShear = true;
  for (let tries = 0; tries < 24; tries++){
    let legs;
    if (level === 0) legs = [{h: pick(low), dur: span(50, 85) * 60}];
    else if (level === 1){
      let a, b, n = 0; do { a = pick(low); b = pick(low); } while ((a === b || angDiff(windDirTo(tab, a), windDirTo(tab, b)) < needMid) && ++n < 40);
      legs = [{h: a, dur: span(25, 45) * 60}, {h: b, dur: span(25, 45) * 60}];
    } else {
      let a, b, n = 0; do { a = pick(low); b = pick(high); } while (angDiff(windDirTo(tab, a), windDirTo(tab, b)) < needHi && ++n < 40);
      legs = [{h: a, dur: span(15, 30) * 60}, {h: b, dur: span(30, 50) * 60}, {h: pick(low), dur: span(10, 20) * 60}];
    }
    const r = planFlight(cfg, tab, legs);
    if (!r.ok || r.vLand > 1.5) continue;
    const dist = Math.hypot(r.e, r.n), okTime = r.t >= 3600 && r.t <= 7200, okSand = r.sandLeft >= 0.12 * r.sand0;
    const cand = Object.assign(r, {legs, dist, brg: (Math.atan2(r.e, r.n) * 180 / Math.PI + 360) % 360, level, lowShear});
    if (okTime && okSand && dist > 3000) return cand;
    if (okSand && (!best || Math.abs(r.t - 5400) < Math.abs(best.t - 5400))) best = cand;      // Notlösung: die Fahrt, die 90 Minuten am nächsten kommt
  }
  return best;
}
/* Punkte (PUN-01, PUN-02): 100 bis 20 m Abstand, linear fallend auf 0 bei 1 km; harte Landung kostet bis zur Hälfte (vorläufig, OP-05). */
const LAND_SOFT = 1.0, LAND_HARD = 3.0;   // m/s Sinken beim Aufsetzen
function scoreLanding(distM, vLand){
  const base = distM <= 20 ? 100 : distM >= 1000 ? 0 : 100 * (1000 - distM) / 980;
  const f = vLand <= LAND_SOFT ? 1 : vLand >= LAND_HARD ? 0.5 : 1 - 0.5 * (vLand - LAND_SOFT) / (LAND_HARD - LAND_SOFT);
  return Math.round(base * f);
}

const BUILD = '2026-10-08.1';
const $ = id => document.getElementById(id);
const store = { get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const pause = ms => new Promise(r => setTimeout(r, ms));

const navLang = (() => { const n = (navigator.language || 'en').toLowerCase(); if (n.startsWith('zh')) return 'zh-TW'; const c = n.slice(0, 2); return LANGS.some(l => l[0] === c) ? c : 'en'; })();
const UI = Object.assign({lang: navLang, map: 'dark', unit: 'kmh', gas: 0, sound: 1, mode: 'free', wx: 'real', level: 0}, store.get('gb-ui', {}), {speed: 1});   // jede Fahrt beginnt mit 1×
if (!TX[UI.lang]) UI.lang = 'en';
const saveUI = () => store.set('gb-ui', UI);
function tr(k, p){ let s = TX[UI.lang][k] ?? TX.en[k] ?? TX.de[k] ?? k; if (p) for (const q in p) s = s.replace('{' + q + '}', p[q]); return s; }
const nf = (x, d = 0) => x.toLocaleString(UI.lang, {minimumFractionDigits: d, maximumFractionDigits: d});
const fmtV = v => { if (Math.abs(v) < 0.05) v = 0; return (v >= 0 ? '+' : '−') + nf(Math.abs(v), 1); };
const fmtD = d => d < 1000 ? Math.round(d) + ' m' : nf(d / 1000, 1) + ' km';
const fmtT = t => { t = Math.floor(t); return Math.floor(t / 3600) + ':' + String(Math.floor(t / 60) % 60).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const UNITS = {kmh: [3.6, 'km/h'], kt: [1.943844, 'kt'], ms: [1, 'm/s']};
const spd = v => Math.round(v * UNITS[UI.unit][0]);
const dirFrom = (u, v) => (Math.atan2(-u, -v) * 180 / Math.PI + 360) % 360;
const dirTo = (u, v) => (Math.atan2(u, v) * 180 / Math.PI + 360) % 360;
const deg3 = d => String(Math.round(d) % 360).padStart(3, '0') + '°';
const CARD = {de: ['N','NO','O','SO','S','SW','W','NW'], en: ['N','NE','E','SE','S','SW','W','NW'], fr: ['N','NE','E','SE','S','SO','O','NO'], pl: ['N','NE','E','SE','S','SW','W','NW'], cs: ['S','SV','V','JV','J','JZ','Z','SZ'], 'zh-TW': ['北','東北','東','東南','南','西南','西','西北'], es: ['N','NE','E','SE','S','SO','O','NO']};

const SND = (() => {
  let ctx = null, master = null, buf = null, hiss = null, lastScoop = 0;
  function ensure(){
    if (!UI.sound) return null;
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      try{ ctx = new AC(); }catch(e){ return null; }
      master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
      buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function noise(o){   // Rauschen durch ein Filter, das von f0 nach f1 gleitet
    const c = ensure(); if (!c) return; const t = c.currentTime + (o.at || 0);
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7; f.frequency.setValueAtTime(o.f0, t); f.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + o.dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.peak, t + (o.attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random()); src.stop(t + o.dur + 0.05);
  }
  function tone(o){
    const c = ensure(); if (!c) return; const t = c.currentTime + (o.at || 0);
    const os = c.createOscillator(); os.type = o.type || 'sine'; os.frequency.setValueAtTime(o.f0, t); os.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + o.dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.peak, t + (o.attack || 0.008)); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    os.connect(g); g.connect(master); os.start(t); os.stop(t + o.dur + 0.05);
  }
  return {
    sack(){   // schwerer Sack rutscht über den Korbrand: dumpfes Wuchten, langes Nachrauschen
      tone({f0: 125, f1: 45, dur: 0.38, peak: 0.6});
      noise({f0: 1000, f1: 180, dur: 0.75, peak: 0.30, attack: 0.05});
      noise({type: 'bandpass', f0: 2400, f1: 1300, q: 0.8, dur: 0.70, peak: 0.08, attack: 0.10, at: 0.12});
    },
    scoop(){  // leichte Schaufel: weiches, längeres Rieseln, deutlich leiser und heller als der Sack
      const now = Date.now(); if (now - lastScoop < 380) return; lastScoop = now;
      noise({type: 'bandpass', f0: 3000, f1: 4400, q: 0.8, dur: 0.50, peak: 0.09, attack: 0.14});
      noise({type: 'highpass', f0: 5200, f1: 6800, q: 0.5, dur: 0.95, peak: 0.045, attack: 0.30, at: 0.10});
    },
    valve(v){ // Zischen folgt der Öffnung; ab 30 % kommt das Flattern des Stoffs im Gasstrom dazu
      if (!UI.sound) v = 0;
      if (!hiss){
        if (v <= 0) return; const c = ensure(); if (!c) return;
        const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
        const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.6; f.frequency.value = 1500;
        const g = c.createGain(); g.gain.value = 0; src.connect(f); f.connect(g); g.connect(master);
        // Flattern: tieferes Rauschen, dessen Lautstärke ein schneller Sägezahn zerhackt
        const ff = c.createBiquadFilter(); ff.type = 'bandpass'; ff.Q.value = 0.9; ff.frequency.value = 650;
        const am = c.createGain(); am.gain.value = 0.5; const lfo = c.createOscillator(); lfo.type = 'sawtooth'; lfo.frequency.value = 24; const depth = c.createGain(); depth.gain.value = 0.5;
        lfo.connect(depth); depth.connect(am.gain);
        const fg = c.createGain(); fg.gain.value = 0; src.connect(ff); ff.connect(am); am.connect(fg); fg.connect(master);
        src.start(); lfo.start();
        hiss = {f, g, fg, lfo, ff};
      } else if (v > 0) ensure();
      const t = ctx.currentTime, fl = Math.max(0, (v - 0.3) / 0.7);
      hiss.g.gain.setTargetAtTime(v > 0 ? 0.04 + 0.42 * v * v : 0, t, v > 0 ? 0.04 : 0.09);
      hiss.f.frequency.setTargetAtTime(1300 + 3400 * v, t, 0.05);
      hiss.fg.gain.setTargetAtTime(fl > 0 ? 0.10 + 0.75 * fl : 0, t, 0.06);
      hiss.lfo.frequency.setTargetAtTime(22 + 22 * fl, t, 0.08);
      hiss.ff.frequency.setTargetAtTime(520 + 500 * fl, t, 0.08);
    },
    land(v){
      if (v >= LAND_HARD){          // sehr harte Landung
        tone({f0: 95, f1: 32, dur: 0.6, peak: 0.95});
        noise({f0: 1600, f1: 140, dur: 0.5, peak: 0.7});
        noise({type: 'bandpass', f0: 900, f1: 500, q: 1.2, dur: 0.28, peak: 0.4, at: 0.13});
        noise({type: 'bandpass', f0: 700, f1: 380, q: 1.2, dur: 0.22, peak: 0.25, at: 0.30});
      } else if (v <= LAND_SOFT){   // sanfte Landung
        tone({f0: 110, f1: 70, dur: 0.18, peak: 0.28});
        noise({f0: 500, f1: 220, dur: 0.2, peak: 0.10, attack: 0.03});
        [[659.25, 0.18], [830.61, 0.33], [987.77, 0.48]].forEach(n => { tone({type: 'triangle', f0: n[0], dur: 0.7, peak: 0.20, at: n[1]}); tone({f0: n[0] * 2, dur: 0.5, peak: 0.05, at: n[1]}); });
      } else {
        tone({f0: 105, f1: 48, dur: 0.3, peak: 0.6});
        noise({f0: 800, f1: 200, dur: 0.25, peak: 0.3});
      }
    }
  };
})();

/* ---------- Wetter laden (MET-01 bis MET-03, MET-06) ---------- */
async function loadWx(){
  const kmTo = c => Math.hypot((c.lat - START.lat) * 111.32, (c.lon - START.lon) * 111.32 * Math.cos(START.lat * Math.PI / 180));
  try{
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 12000);
    const r = await fetch(wxUrl(START.lat, START.lon), {signal: ac.signal}); clearTimeout(to);
    if (!r.ok) throw new Error('http ' + r.status);
    const m = wxParse(await r.json(), Date.now()); if (!m) throw new Error('parse');
    store.set('gb-wx', {lat: START.lat, lon: START.lon, at: Date.now(), m});
    return m;
  }catch(e){
    const c = store.get('gb-wx', null);                                   // ohne Netz: zuletzt geladenes Wetter, wenn es nah und frisch genug ist
    if (c && c.m && kmTo(c) < 20 && Date.now() - c.at < 6 * 3600e3){ c.m.cached = true; return c.m; }
    return null;
  }
}

/* ---------- Ventil: proportional ziehen, beliebig lange halten; beim Loslassen schließt es ---------- */
(function bindValve(){
  const el = $('valve'), knob = $('vknob'), line = $('vline'); let y0 = 0, active = false, told = false; const FULL = 150;   // px Fingerweg für voll geöffnet
  const range = () => Math.max(20, el.clientHeight - knob.offsetHeight);
  const show = () => { const y = valve * range(); knob.style.top = y + 'px'; line.style.height = y + 'px'; knob.textContent = Math.round(valve * 100); el.setAttribute('aria-valuenow', Math.round(valve * 100)); $('seg-speed').classList.toggle('held', valve > 0 && UI.speed > 1); };
  const set = v => { valve = (STATE !== 'play' || B.landed || !B.ok) ? 0 : Math.min(1, Math.max(0, v)); show(); SND.valve(valve); if (valve > 0 && UI.speed > 1 && !told){ told = true; toast(tr('toast_valve')); } };
  el.addEventListener('pointerdown', e => { e.preventDefault(); active = true; el.classList.remove('rel'); el.setPointerCapture(e.pointerId); y0 = e.clientY - valve * FULL; });
  el.addEventListener('pointermove', e => { if (active) set((e.clientY - y0) / FULL); });
  const end = () => { if (!active) return; active = false; el.classList.add('rel'); set(0); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, end));
  el.addEventListener('keydown', e => { if (e.key === 'ArrowDown'){ e.preventDefault(); set(valve + 0.1); } if (e.key === 'ArrowUp' || e.key === 'Escape'){ e.preventDefault(); set(e.key === 'Escape' ? 0 : valve - 0.1); } });
  window.addEventListener('blur', () => { active = false; set(0); });
  show();
})();

/* ---------- Vertikalprofil: Höhe, Temperatur mit Schichtung, Wind als Windfähnchen ---------- */
/* Windfähnchen wie in meteorologischen Diagrammen: Der Schaft zeigt dorthin, woher der Wind kommt;
   kurzer Strich 5 kt, langer Strich 10 kt, Dreieck 50 kt; Kreis bei Windstille. */
function drawBarb(c, x, y, fromRad, kt, L){
  c.save(); c.translate(x, y); c.strokeStyle = c.fillStyle = '#4cc9ff'; c.lineWidth = 1.5; c.lineCap = 'round';
  if (kt < 2.5){ c.beginPath(); c.arc(0, 0, 4, 0, 7); c.stroke(); c.restore(); return; }
  c.rotate(fromRad);
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -L); c.stroke(); c.beginPath(); c.arc(0, 0, 1.8, 0, 7); c.fill();
  let n = Math.round(kt / 5); const tri = Math.floor(n / 10); n -= tri * 10; const full = Math.floor(n / 2), half = n % 2, bl = L * 0.5;
  let py = -L;
  for (let i = 0; i < tri; i++){ c.beginPath(); c.moveTo(0, py); c.lineTo(bl, py + 1.5); c.lineTo(0, py + 4.5); c.closePath(); c.fill(); py += 5.5; }
  for (let i = 0; i < full; i++){ c.beginPath(); c.moveTo(0, py); c.lineTo(bl, py - 2.5); c.stroke(); py += 3.5; }
  if (half){ if (!full && !tri) py += 3.5; c.beginPath(); c.moveTo(0, py); c.lineTo(bl / 2, py - 1.25); c.stroke(); }
  c.restore();
}
function drawProf(){
  const cv = $('prof-cv'), W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const top = Math.min(9000, Math.max(2000, Math.ceil((B.h + 300) / 1000) * 1000));
  const pt = 22, pb = 18, y = z => H - pb - z / top * (H - pt - pb), wide = W >= 120;
  const xL = 27, xS = xL + 2, xT0 = xS + 7, xT1 = Math.max(xT0 + 14, W - (wide ? 62 : 50)), xA = W - (wide ? 40 : 33), xN = W - 15, bL = wide ? 18 : 14;
  const num = '600 11.5px "Barlow Condensed","Arial Narrow",sans-serif', small = '500 10px Barlow,"Segoe UI",sans-serif';
  // Schichtung in 50-m-Stücken: Inversion, sehr stabil, normal, labil
  const cls = g => g > 0.0005 ? 3 : g > -0.004 ? 2 : g > -0.0090 ? 1 : 0, col = ['#4cc9ff', '#5d6f8f', '#ffe14d', '#ff6e5f'];
  let Tmin = 1e9, Tmax = -1e9;
  for (let z = 0; z <= top; z += 50){ const T = atmAt(ATM, z).T; Tmin = Math.min(Tmin, T); Tmax = Math.max(Tmax, T); }
  const xT = T => xT0 + (T - Tmin) / Math.max(1, Tmax - Tmin) * (xT1 - xT0);
  let bandTop = -1, labelled = false;
  for (let z = 0; z < top; z += 50){
    const g = (atmAt(ATM, z + 50).T - atmAt(ATM, z).T) / 50, k = cls(g);
    if (k === 3){ c.fillStyle = 'rgba(255,110,95,.18)'; c.fillRect(xS, y(z + 50), W - xS, y(z) - y(z + 50) + .5); bandTop = z + 50; }
    else if (bandTop >= 0){ if (!labelled){ labelled = true; c.fillStyle = '#ff9d92'; c.font = small; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(tr(wide ? 'inv' : 'inv_s'), xT0 + 1, y(bandTop) - 3); } bandTop = -1; }
    c.fillStyle = col[k]; c.fillRect(xS, y(z + 50), 4, y(z) - y(z + 50) + .5);
  }
  // Höhenlinien
  const stepZ = top <= 3000 ? 500 : top <= 6000 ? 1000 : 2000;
  c.font = num; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let z = 0; z <= top; z += stepZ){ c.strokeStyle = 'rgba(154,171,196,.18)'; c.lineWidth = 1; c.beginPath(); c.moveTo(xS + 5, y(z) + .5); c.lineTo(W - 4, y(z) + .5); c.stroke(); c.fillStyle = '#9aabc4'; c.fillText(z, xL - 2, y(z)); }
  // Temperaturkurve
  c.strokeStyle = '#eef3fa'; c.lineWidth = 1.8; c.lineJoin = 'round'; c.beginPath();
  for (let z = 0; z <= top; z += 50){ const px = xT(atmAt(ATM, z).T), py = y(z); z ? c.lineTo(px, py) : c.moveTo(px, py); } c.stroke();
  c.font = small; c.fillStyle = '#9aabc4'; c.textBaseline = 'alphabetic';
  c.textAlign = 'left'; c.fillText(Math.round(Tmin - 273.15) + '…' + Math.round(Tmax - 273.15) + ' °C', xS, H - 5);
  c.textAlign = 'right'; c.fillText('m', xL - 2, 13); c.textAlign = 'left'; c.fillText('T', xT0, 13); c.textAlign = 'right'; c.fillText(UNITS[UI.unit][1], W - 4, 13);
  // Wind
  let stepW = 250; for (const s of [100, 250, 500, 1000, 2000]){ if (y(0) - y(s) >= 30){ stepW = s; break; } }
  for (let z = (stepW >= 250 ? stepW / 2 : stepW); z < top; z += stepW){
    const a = atmAt(ATM, z), sp = Math.hypot(a.u, a.v);
    drawBarb(c, xA, y(z), Math.atan2(-a.u, -a.v), sp * 1.943844, bL);
    c.font = num; c.fillStyle = '#eef3fa'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(spd(sp), xN, y(z));
  }
  // Ballon
  const yb = y(Math.min(B.h, top));
  c.strokeStyle = '#ff9f1c'; c.lineWidth = 2; c.beginPath(); c.moveTo(xS + 5, yb); c.lineTo(W - 4, yb); c.stroke();
  c.fillStyle = '#ff9f1c'; c.beginPath(); c.arc(xT(atmAt(ATM, B.h).T), yb, 5, 0, 7); c.fill(); c.strokeStyle = '#0a1019'; c.lineWidth = 1.5; c.stroke();
}
$('prof').addEventListener('click', () => $('prof').classList.toggle('big'));

/* ---------- Anzeige ---------- */
function updInst(){
  const a = atmAt(ATM, B.h);
  $('i-agl').innerHTML = nf(Math.round(B.h)) + '<small>m</small>';
  $('i-nn').textContent = groundAlt != null && isFinite(groundAlt) ? 'NN ' + nf(Math.round(B.h + groundAlt)) + ' m' : 'NN –';
  const v = $('i-vario'); v.textContent = fmtV(B.w); v.style.color = B.w > 0.3 ? 'var(--up)' : B.w < -0.3 ? 'var(--dn)' : 'var(--tx)';
  const sp = Math.hypot(a.u, a.v), moving = B.h > 0 && !B.landed;
  $('i-track').textContent = moving ? deg3(dirTo(a.u, a.v)) + ' ' + spd(sp) : '–';
  if (TARGET){ const de = TARGET.e - B.e, dn = TARGET.n - B.n; $('i-tdist').textContent = fmtD(Math.hypot(de, dn)); $('i-tbrg').textContent = deg3((Math.atan2(de, dn) * 180 / Math.PI + 360) % 360); }
  $('i-time').textContent = fmtT(B.t); $('i-dist').textContent = fmtD(B.dist);
  $('i-fill').textContent = nf(B.gas0 > 0 ? B.gas / B.gas0 * 100 : 0) + ' %';
  document.querySelectorAll('.gasaid').forEach(el => { el.hidden = !UI.gas; });
  if (UI.gas){ $('i-gas').textContent = nf(Math.round(B.gas * R_GAS * B.Tg / a.p)); $('i-gast').textContent = fmtV(B.Tg - a.T); }
  const hint = $('hint');
  if (STATE !== 'play') hint.hidden = true;
  else if (!B.ok){ hint.hidden = false; hint.textContent = tr('hint_heavy'); }
  else if (B.h <= 0 && !B.air && !B.landed){ hint.hidden = false; hint.textContent = tr('hint_start'); }
  else hint.hidden = true;
}
function showResult(){
  $('r-sink').textContent = nf(B.vLand, 1) + ' m/s'; $('r-time').textContent = fmtT(B.t); $('r-dist').textContent = fmtD(B.dist);
  $('r-line').textContent = fmtD(Math.hypot(B.e, B.n)); $('r-max').textContent = nf(Math.round(B.maxH)) + ' m'; $('r-sand').textContent = nf(sandKg(B, CFG), 1) + ' kg'; $('r-gas').textContent = nf(B.gas / B.gas0 * 100) + ' %';
  document.querySelectorAll('.tgtres').forEach(el => { el.hidden = !TARGET; });
  if (TARGET){
    const d = Math.hypot(TARGET.e - B.e, TARGET.n - B.n);
    $('r-tdist').textContent = fmtD(d); $('r-pts').textContent = scoreLanding(d, B.vLand);
    bestLine.setLatLngs(TARGET.path.map(p => ll(p[0], p[1])));                // Vergleichsfahrt zeigen (SPI-06)
  }
  $('result').hidden = false; valve = 0; setState('done'); SND.land(B.vLand); renderSand(true);
}
$('again').addEventListener('click', prepareRun);
$('r-menu').addEventListener('click', showMenu);

/* ---------- Hauptmenü: bewegtes Bild im Stil der Heimcomputer der 80er, Ballon von der Seite ---------- */
const RETRO = (() => {
  const cv = $('c64'); let W = 160, H = 100, c = null, t = 0, acc = 0, sand = [], puffs = [];
  const P = {sky: '#352879', lb: '#6C5EB5', wh: '#FFFFFF', ye: '#B8C76F', re: '#9A6759', br: '#6F4F25', gr: '#588D43', lg: '#9AD284', gy: '#959595', bk: '#000000', cy: '#70A4B2'};
  const clouds = [[20, 0.10, 26], [95, 0.22, 34], [150, 0.05, 20], [60, 0.34, 22]];
  const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  function size(){ const r = cv.getBoundingClientRect(); if (!r.width || !r.height) return false; H = Math.max(90, Math.round(W * r.height / r.width)); if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; } c = cv.getContext('2d'); c.imageSmoothingEnabled = false; return true; }
  function balloon(bx, by){
    for (let dy = -14; dy <= 14; dy++){ const hw = Math.round(Math.sqrt(196 - dy * dy)); px(bx - hw, by + dy, hw * 2, 1, P.ye);
      for (const sx of [-9, -3, 3, 9]){ const w = 2; if (Math.abs(sx) + w <= hw) px(bx + sx - 1, by + dy, w, 1, P.re); } }
    for (let i = 0; i < 6; i++){ const hw = 9 - i; px(bx - hw, by + 14 + i, hw * 2, 1, i % 2 ? P.re : P.ye); }                      // Füllansatz
    for (let i = 0; i < 9; i++){ px(bx - 9 + i * 0.6, by + 14 + i, 1, 1, P.gy); px(bx + 8 - i * 0.6, by + 14 + i, 1, 1, P.gy); }  // Leinen
    px(bx - 4, by + 23, 8, 6, P.br); px(bx - 4, by + 23, 8, 1, P.wh); px(bx - 5, by + 25, 1, 3, P.ye); px(bx + 4, by + 25, 1, 3, P.ye);   // Korb mit Sandsäcken
  }
  function draw(dt){
    if (!size()) return; t += dt;
    const land = H < 150, card = document.querySelector('.mcard').getBoundingClientRect(), box = cv.getBoundingClientRect(), k = H / box.height;
    const ground = H - 20, bx = land ? Math.round(Math.max(20, (card.left - box.left) * k / 2)) : 80;
    const yTop = 20, yBot = land ? ground - 34 : Math.max(yTop + 26, (card.top - box.top) * k - 34);
    const ph = (t % 16) / 16, by = yBot - (yBot - yTop) * (0.5 - 0.5 * Math.cos(2 * Math.PI * ph));
    px(0, 0, W, H, P.sky);
    for (const cl of clouds){ const cx = ((cl[0] - t * 3) % (W + 60) + W + 60) % (W + 60) - 30, cy = cl[1] * H; px(cx, cy, cl[2], 4, P.wh); px(cx + 4, cy - 3, cl[2] - 10, 3, P.wh); px(cx + 2, cy + 4, cl[2] - 6, 2, P.lb); }
    for (let x = 0; x < W; x += 2){ const hh = 6 + Math.round(5 * Math.sin((x + t * 8) / 17) + 3 * Math.sin((x + t * 8) / 7)); px(x, ground - hh, 2, hh, P.gr); }   // Hügel ziehen vorbei
    px(0, ground, W, H - ground, P.lg); for (let x = 0; x < W; x += 8) px((x - t * 14 % 8 + 8) % W, ground + 4 + (x % 3) * 4, 3, 1, P.gr);
    // Sand abwerfen im unteren Teil der Fahrt, Gas ablassen im oberen
    if (ph < 0.10 || ph > 0.93){ for (let i = 0; i < 2; i++) sand.push({x: bx - 5 + Math.random() * 2, y: by + 28, v: 6 + Math.random() * 6}); }
    if (ph > 0.44 && ph < 0.54 && Math.random() < 0.6) puffs.push({x: bx - 2 + Math.random() * 4, y: by - 15, a: 1});
    sand = sand.filter(s => (s.y += s.v * dt, s.v += 60 * dt, s.y < ground + 2)); for (const s of sand) px(s.x, s.y, 1, 1, P.ye);
    puffs = puffs.filter(p => (p.y -= 9 * dt, p.a -= dt * 0.9, p.a > 0)); for (const p of puffs) px(p.x, p.y, 2, 1, P.wh);
    balloon(bx, Math.round(by));
  }
  return { tick(real){ acc += real; if (acc < 1 / 15) return; draw(acc); acc = 0; } };   // 15 Bilder je Sekunde
})();

/* ---------- Zeitschleife ---------- */
let lastTs = 0;
function frame(ts){
  const real = Math.min(0.1, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if (STATE === 'menu'){ RETRO.tick(real); requestAnimationFrame(frame); return; }
  if (STATE === 'play' && !B.landed && B.ok){
    let simDt = real * (valve > 0 ? 1 : UI.speed);                    // solange das Ventil gezogen ist, läuft die Zeit 1×
    while (simDt > 1e-6 && !B.landed){ const d = Math.min(0.25, simDt); stepBalloon(B, CFG, ATM, d, valve); simDt -= d; }
    if (Math.hypot(B.e - lastPathE, B.n - lastPathN) > 25){ lastPathE = B.e; lastPathN = B.n; pathPts.push(ll(B.e, B.n)); if (pathPts.length > 4000) pathPts = pathPts.filter((p, i) => i % 2 === 0 || i > pathPts.length - 200); pathLine.setLatLngs(pathPts); }
    const p = ll(B.e, B.n); balMk.setLatLng(p); if (follow && B.h > 0) map.panTo(p, {animate: false});
    if (B.landed && !shown){ shown = true; pathPts.push(p); pathLine.setLatLngs(pathPts); showResult(); }
  }
  updInst(); drawProf();
  requestAnimationFrame(frame);
}

/* ---------- Einstellungen ---------- */
const openSheet = o => { $('sheet').classList.toggle('open', o); $('sheet').setAttribute('aria-hidden', o ? 'false' : 'true'); if (o) cfgFill(); };
$('btn-set').addEventListener('click', () => openSheet(!$('sheet').classList.contains('open')));
$('set-close').addEventListener('click', () => openSheet(false));
$('set-menu').addEventListener('click', async () => {
  if (STATE === 'play' && B.air && !(await confirmBox(tr('cf_menu'), tr('cf_menu_ok')))) return;
  openSheet(false); showMenu();
});
function bindSeg(id, cur, onPick){ const el = $(id); const mark = v => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v))); mark(cur); el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { mark(b.dataset.v); onPick(b.dataset.v); })); }
bindSeg('seg-speed', UI.speed, v => { UI.speed = +v; });
bindSeg('seg-map', UI.map, v => { UI.map = v; saveUI(); applyTiles(); });
bindSeg('seg-unit', UI.unit, v => { UI.unit = v; saveUI(); });
bindSeg('seg-gas', UI.gas, v => { UI.gas = +v; saveUI(); });
bindSeg('seg-snd', UI.sound, v => { UI.sound = +v; saveUI(); if (UI.sound) SND.scoop(); else SND.valve(0); });
bindSeg('seg-wx', UI.wx, v => { UI.wx = v; saveUI(); });
bindSeg('seg-level', UI.level, v => { UI.level = +v; saveUI(); });

const CF = {vol: 'c-vol', rust: 'c-rust', envKg: 'c-env', equip: 'c-equip', pax: 'c-pax', paxKg: 'c-paxkg'};
function cfgFill(){ for (const k in CF) $(CF[k]).value = CFG[k]; cfgCalc(); }
function cfgRead(){ const c = Object.assign({}, CFG); for (const k in CF){ const el = $(CF[k]), v = parseFloat(String(el.value).replace(',', '.')); if (isFinite(v)) c[k] = Math.min(+el.max, Math.max(+el.min, k === 'pax' ? Math.round(v) : v)); } return c; }
function cfgCalc(){
  const c = cfgRead(), Lo = loadout(c, ATM), box = $('cfg-calc'); box.classList.toggle('bad', !Lo.ok);
  box.textContent = Lo.ok ? tr('calc', {lift: nf(Lo.lift, 1), trim: nf(Lo.trim, 1), sacks: Lo.sacks, mulde: nf(Lo.mU / 10, 1)}) : tr('calc_bad', {lift: nf(Lo.lift, 1), load: nf(fixedKg(c))});
}
for (const k in CF) $(CF[k]).addEventListener('input', cfgCalc);
$('cfg-apply').addEventListener('click', async () => {
  const running = STATE === 'play' || STATE === 'brief' || STATE === 'done';
  if (running && !(await confirmBox(tr('cf_restart'), tr('cf_restart_ok')))) return;      // Rückfrage: neu starten oder abbrechen
  CFG = cfgRead(); store.set('gb-cfg2', {vol: CFG.vol, rust: CFG.rust, envKg: CFG.envKg, equip: CFG.equip, pax: CFG.pax, paxKg: CFG.paxKg}); cfgFill(); openSheet(false);
  if (running) prepareRun(); else B = newBalloon(CFG, ATM);
});
$('cfg-reset').addEventListener('click', () => { for (const k in CF) $(CF[k]).value = DEFAULT_CFG[k]; cfgCalc(); });

/* ---------- Sprache: Flaggen als kleine Grafiken, auf jedem Gerät gleich (aus der Tracker-App) ---------- */
const FLAGS = {
 'de':'<rect width="60" height="13.4" fill="#000"/><rect y="13.4" width="60" height="13.3" fill="#D00"/><rect y="26.7" width="60" height="13.3" fill="#FFCE00"/>',
 'en':'<rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="12"/><path d="M30 0V40M0 20H60" stroke="#C8102E" stroke-width="7"/>',
 'fr':'<rect width="20" height="40" fill="#0055A4"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#EF4135"/>',
 'pl':'<rect width="60" height="20" fill="#fff"/><rect y="20" width="60" height="20" fill="#DC143C"/>',

 'zh-TW':'<rect width="60" height="40" fill="#FE0000"/><rect width="30" height="20" fill="#000095"/><circle cx="15" cy="10" r="6.2" fill="#fff"/><circle cx="15" cy="10" r="4.7" fill="#000095"/><circle cx="15" cy="10" r="3.7" fill="#fff"/>'
};
const flagSVG = c => '<svg class="flag" viewBox="0 0 60 40" width="30" height="20" aria-hidden="true" focusable="false">' + (FLAGS[c] || '') + '</svg>';
const CHEV = '<svg class="chev" width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function applyLang(){
  document.documentElement.lang = UI.lang;
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = tr(el.dataset.i); });
  document.querySelectorAll('[data-ia]').forEach(el => el.setAttribute('aria-label', tr(el.dataset.ia)));
  $('lang-btn').innerHTML = flagSVG(UI.lang) + CHEV;
  document.querySelectorAll('#lang-list .lopt').forEach(o => { const on = o.dataset.c === UI.lang; o.classList.toggle('on', on); o.setAttribute('aria-selected', on ? 'true' : 'false'); });
  startMk.setTooltipContent(tr('launch')); tgtMk.setTooltipContent(tr('target'));
  renderSand(true); cfgCalc(); stShow();
  if (STATE === 'setup') $('su-title').textContent = tr(UI.mode === 'challenge' ? 'm_chal' : 'm_free');
  if (STATE === 'brief') showStart();
}
(function initLang(){
  const list = $('lang-list'), btn = $('lang-btn'), close = () => { list.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  LANGS.forEach(([c, n]) => {
    const o = document.createElement('button'); o.type = 'button'; o.className = 'lopt'; o.dataset.c = c; o.setAttribute('role', 'option'); o.setAttribute('lang', c);
    o.innerHTML = flagSVG(c) + '<span></span>'; o.lastChild.textContent = n;
    o.addEventListener('click', () => { UI.lang = c; saveUI(); applyLang(); close(); btn.focus(); });
    list.appendChild(o);
  });
  btn.addEventListener('click', e => { e.stopPropagation(); const open = list.hidden; list.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false'); });
  document.addEventListener('click', e => { if (!list.hidden && !$('lang-sel').contains(e.target)) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !list.hidden){ close(); btn.focus(); } });
})();

/* ---------- Service Worker, Version ---------- */
$('ver').textContent = BUILD;
$('reload').addEventListener('click', async () => {
  try{ if ('serviceWorker' in navigator){ for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope.endsWith('/spiel/') || r.scope === new URL('./', location.href).href) await r.unregister(); }
       if (window.caches){ for (const k of await caches.keys()) if (k.startsWith('gb-shell')) await caches.delete(k); } }catch(e){}
  location.reload();
});
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast(tr('toast_newver')); had = true; });
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', {scope: './', updateViaCache: 'none'}).then(r => r.update()).catch(() => {}); });
}

applyLang(); applyTiles(); renderSand(true); setState('menu');
