<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1019">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gasballon">
<title>Gasballon-Simulator</title>

<!-- Leaflet (Karte); Schriften wie in der Tracker-App -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a1019; --pan:#111b2b; --pan2:#17253b;
  --line:#28395a; --tx:#eef3fa; --mut:#9aabc4;
  --orb:#ff9f1c; --base:#4cc9ff;
  --up:#5fe3a1; --dn:#ff6e5f; --warn:#ffe14d;
  --sand:#d9b36c; --sand2:#a9843f;
  --ui:'Barlow','Segoe UI',system-ui,sans-serif;
  --num:'Barlow Condensed','Arial Narrow','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#04070c;color:var(--tx);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--base);outline-offset:2px}

#app{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.lbl{font-size:12px;color:var(--mut);line-height:1.15}

/* Kopfzeile */
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:max(8px,env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{min-width:0;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:8px;font-family:var(--num);font-weight:700;font-size:21px;letter-spacing:.02em}
.hrow{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--pan);display:grid;place-items:center;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 9px;font-size:13px;color:var(--mut);min-height:36px;min-width:38px}
.seg button.on{background:var(--pan2);color:var(--tx);font-weight:600}
#seg-speed button{font-family:var(--num);font-size:15px;min-width:27px;padding:6px 4px}
#app:not(.inmenu) #lang-btn .chev{display:none}
@media (max-width:440px){#app.playing .langdd{display:none}}
#btn-pause{display:grid;place-items:center}
#seg-speed #btn-pause.on{background:var(--warn);color:#1a1000}
#seg-speed button.on{background:var(--orb);color:#1a1000}
#seg-speed.held button.on{background:var(--pan2);color:var(--tx)}

/* Bühne: Karte und Bedienfeld */
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
main{position:relative;flex:1;min-height:0}
.map{position:absolute;inset:0;z-index:0;background:#0d1626}
.ov{position:absolute;z-index:500}
.card{background:rgba(10,16,25,.9);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px)}
.leaflet-tile.tiles-dark{filter:invert(1) hue-rotate(180deg) saturate(.55) brightness(.93) contrast(.95)}
.leaflet-container{background:#0d1626;font-family:var(--ui)}
.leaflet-control-attribution{background:rgba(10,16,25,.7)!important;color:#8fa2bf!important;font-size:10px}
.leaflet-control-attribution a{color:#b7c8e2!important}
.mk{background:none;border:0}
.ptip{background:rgba(10,16,25,.88);color:#eef3fa;border:0;box-shadow:none;font-size:12px;padding:1px 6px;font-family:var(--ui)}
.ptip::before{display:none}

/* Vertikalprofil */
#prof{left:0;top:0;width:96px;height:62%;padding:0;overflow:hidden;border-left:0;border-top:0;border-radius:0 0 14px 0;cursor:pointer}
#prof.big{width:150px;height:auto;bottom:0;border-radius:0}
#prof canvas{display:block;width:100%;height:100%}

/* Instrumente */
#inst{right:0;top:0;width:104px;padding:5px 7px 6px 8px;border-right:0;border-top:0;border-radius:0 0 0 14px}
#i-agl{font-size:30px;font-weight:700;line-height:1;white-space:nowrap}
#i-agl small{font-size:13px;font-weight:600;color:var(--mut);margin-left:2px}
#i-nn{font-size:12.5px;color:var(--mut);margin:0 0 3px;white-space:nowrap}
#inst .lbl{font-size:11px}
#inst .kv{gap:4px;padding:.5px 0}
#inst .kv span{font-size:11px}
#inst .kv b{font-size:14px}
#inst{overflow:hidden}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:1.5px 0}
.kv span{font-size:12px;color:var(--mut);white-space:nowrap}
.kv b{font-family:var(--num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
#inst #i-vario{font-size:17px}
/* Balken der Vertikalbeschleunigung links neben dem Vario: wächst von der Mitte der Zeile nach oben (grün) oder nach unten (rot); bei 0 unsichtbar */
#row-vario{position:relative}
#i-acc{position:absolute;left:-6px;width:4px;height:0;border-radius:2px;pointer-events:none}
#i-acc.up{bottom:50%;background:var(--up)} #i-acc.dn{top:50%;background:var(--dn)}

#hint{left:8px;right:8px;bottom:74px;padding:8px 10px;font-size:13px;line-height:1.3;text-align:center}
#paused{left:50%;top:42%;transform:translate(-50%,-50%);padding:8px 24px;font-family:var(--num);font-size:26px;font-weight:700;letter-spacing:.08em;z-index:600}
#rope{flex:1;margin-top:3px;min-height:62px;border-radius:10px;border:1px solid var(--line);background:#0d1626;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
#rope.on{border-color:var(--sand2);background:#3a2f18}
#rope .hang{display:none} #rope.on .hang{display:block} #rope.on .coil{display:none}
#rope b{font-family:var(--num);font-size:11px;font-weight:600;min-height:14px;white-space:pre;text-align:center;line-height:1.15}
#rope:disabled{opacity:.45}
#follow{left:8px;bottom:26px;min-height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--orb);background:var(--orb);color:#1a1000;font-weight:600;font-size:14px}
#result{left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,calc(100% - 24px));padding:14px 14px 12px;z-index:700}
#result h2{margin:0 0 8px;font-family:var(--num);font-size:24px;letter-spacing:.02em}
.pri{width:100%;min-height:44px;margin-top:10px;border-radius:12px;border:1px solid var(--orb);background:var(--orb);color:#1a1000;font-weight:600;font-size:15px}

/* Bedienfeld: Sandsäcke, Sandmulde, Ventil */
.panel{touch-action:manipulation;flex:none;display:grid;grid-template-columns:1.3fr 1fr 54px 50px;gap:5px;padding:6px 5px max(6px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);user-select:none;-webkit-user-select:none}
.panel.off{opacity:.45;pointer-events:none}
.box{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--pan);padding:4px 6px 6px;display:flex;flex-direction:column;min-width:0}
.box h3{margin:0;font-size:11.5px;font-weight:500;color:var(--mut);display:flex;justify-content:space-between;align-items:baseline;gap:4px;white-space:nowrap}
.box h3 b{font-family:var(--num);font-size:15px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
#rack{flex:1;margin-top:3px;border:1px dashed var(--line);border-radius:8px;background:none;padding:5px 4px 4px;display:flex;flex-wrap:wrap;align-content:flex-end;gap:4px 2px;min-height:40px;text-align:left}
#rack:active{border-color:var(--orb)}
#rack:disabled{opacity:.45}
.sack{width:10px;height:12px;border-radius:4px 4px 5px 5px;background:linear-gradient(160deg,var(--sand),var(--sand2));position:relative;flex:none}
.sack::before{content:"";position:absolute;left:3px;right:3px;top:-2px;height:3px;border-radius:2px 2px 0 0;background:var(--sand2)}
.more{font-family:var(--num);font-size:13px;color:var(--mut);align-self:center;padding-left:3px}

#trough{position:relative;flex:1;margin-top:3px;border:2px solid #5d6f8f;border-top:0;border-radius:0 0 10px 10px;overflow:hidden;min-height:30px;background:#0d1626}
#sandfill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,var(--sand),var(--sand2));transition:height .25s}
#trough b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;white-space:nowrap;font-family:var(--num);font-size:17px;font-weight:700;text-shadow:0 1px 3px #000,0 0 8px #000}
#scoop{white-space:nowrap;padding:0 2px;margin-top:4px;min-height:34px;border-radius:10px;border:1px solid var(--sand2);background:#3a2f18;font-weight:600;font-size:12px;touch-action:none}
#scoop:active{background:#5a4a25}
#scoop:disabled{opacity:.45}
#valve{flex:1;position:relative;margin:3px auto 0;width:42px;min-height:62px;touch-action:none;cursor:grab}
#valve::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:#2c3f60}
#vline{position:absolute;left:50%;top:0;width:2px;margin-left:-1px;height:0;background:var(--tx)}
#vknob{position:absolute;left:50%;top:0;width:38px;height:24px;margin-left:-19px;border-radius:8px;border:2px solid var(--dn);background:#3a1614;display:grid;place-items:center;font-family:var(--num);font-size:13px;font-weight:600}
#valve.rel #vknob,#valve.rel #vline{transition:top .18s,height .18s}
.flash{position:absolute;right:8px;top:26px;font-family:var(--num);font-size:18px;font-weight:700;color:var(--up);pointer-events:none;animation:fl 1s ease-out forwards}
@keyframes fl{to{transform:translateY(-26px);opacity:0}}

/* Einstellungen */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:900;max-height:88%;overflow:auto;background:#0d1626;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -18px 40px rgba(0,0,0,.5);padding:12px 12px max(20px,env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease}
.sheet h2{margin:0;font-family:var(--num);font-size:22px}
.sheet h4{margin:16px 0 6px;font-size:14px;font-weight:600}
.shead{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.row input{width:104px;min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--pan);padding:0 10px;font-family:var(--num);font-size:18px;text-align:right}
.sm{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--pan2);font-size:13px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:12.5px;color:var(--mut);line-height:1.4;margin:6px 0 0}
#cfg-calc{margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--pan)}
#cfg-calc.bad{border-color:var(--dn)}

#startwin{position:absolute;inset:0;z-index:800;display:grid;place-items:center;padding:12px;background:rgba(4,7,12,.62)}
#startwin .card{width:min(360px,100%);max-height:100%;overflow:auto;padding:14px 14px 12px;background:#0d1626}
#startwin h2{margin:0 0 8px;font-family:var(--num);font-size:26px;letter-spacing:.02em}
.brief{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:14px;line-height:1.3}
.brief dt{color:var(--mut);font-size:12.5px;padding-top:1px}
.brief dd{margin:0}
#startwin .note{margin-top:10px}
.sec{width:100%;min-height:40px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--pan2);font-weight:600;font-size:14px}
#toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-12px);z-index:2600;padding:9px 14px;border-radius:12px;background:#10243d;border:1px solid var(--line);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100% - 24px);text-align:center}
#install{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));z-index:870;margin:0 auto;max-width:560px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;background:rgba(13,22,38,.97);box-shadow:0 12px 30px rgba(0,0,0,.5)}
#install[hidden]{display:none}
#install img{flex:none;border-radius:9px}
#install .itx{flex:1;min-width:150px} #install .itx b{display:block;font-size:15px} #install .itx span{display:block;font-size:12.5px;color:var(--mut);line-height:1.35}
#install .ibt{display:flex;gap:8px;margin-left:auto}
button.pri2{background:var(--orb);border-color:var(--orb);color:#0a1019;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Handy quer: Bedienfeld rechts neben der Karte */
@media (orientation:landscape) and (max-height:560px){
  .stage{flex-direction:row}
  .panel{width:330px;border-top:0;border-left:1px solid var(--line);align-content:stretch}
  #prof{height:auto;bottom:0;border-radius:0}
  #hint{left:104px;right:112px;top:8px;bottom:auto}
  #scoop{font-size:11px}
}
@media (max-width:400px){.brand span{display:none}}
@media (prefers-reduced-motion:reduce){.sheet,#toast,#sandfill{transition:none}.flash{animation-duration:.01s}.mcard.boot{animation:none}}

/* Sprachwahl mit Flaggen in der Kopfzeile */
.langdd{position:relative;flex:none}
#lang-btn{display:flex;align-items:center;gap:4px;min-height:38px;padding:0 7px;border-radius:12px;border:1px solid var(--line);background:var(--pan)}
#lang-btn .chev{color:var(--mut)}
.flag{flex:none;border-radius:3px;outline:1px solid rgba(255,255,255,.28)}
.langlist{position:absolute;left:0;top:calc(100% + 4px);z-index:3000;width:190px;max-height:min(380px,70vh);overflow:auto;background:#0d1626;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.lopt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:8px;background:transparent;color:var(--tx);font-size:14px;text-align:left}
.lopt.on{background:var(--pan2);font-weight:600}
.lopt.on::after{content:"\2713";margin-left:auto;color:#ffc83d}
#app.inmenu #seg-speed{visibility:hidden}

/* Fenster über der Bühne: Hauptmenü, Vorbereitung, Startfenster, Rückfrage */
.stage{position:relative}
.full{position:absolute;inset:0;z-index:800;display:grid;place-items:center;padding:12px;background:rgba(4,7,12,.62)}
.full>.card{width:min(360px,100%);max-height:100%;overflow:auto;padding:14px 14px 12px;background:#0d1626}
.full h2{margin:0 0 8px;font-family:var(--num);font-size:26px;letter-spacing:.02em}
.full h4{margin:14px 0 6px;font-size:14px;font-weight:600}
.full .note{margin-top:8px}
#confirm{z-index:1000}
#confirm p{margin:0 0 4px;font-size:15px;line-height:1.4}
#busy{z-index:860}
#busy .card{width:auto;padding:14px 18px;font-weight:600}
.seg.wide{display:flex}
.seg.wide button{flex:1;min-height:40px}
.task{border:1px solid var(--orb);border-radius:12px;background:var(--pan);padding:8px 10px}
.task b{display:block;font-size:15px}
.task span{display:block;font-size:13px;color:var(--tx);line-height:1.4}
#menu{z-index:850;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));background:var(--bg)}
.mframe{width:min(100%,600px);height:min(100%,860px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--pan);box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden}
.mbar{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-family:var(--num);font-size:18px;font-weight:600;letter-spacing:.02em}
.mbar i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--orb)}
.mbar span{margin-left:auto;font-size:12px;font-weight:500;color:var(--mut)}
.mscreen{position:relative;flex:1;min-height:0;margin:8px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#352879}
@media (max-height:500px){.mbar{display:none}}
#c64{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.mcard{position:relative;width:min(340px,calc(100% - 20px));max-height:calc(100% - 12px);overflow:auto;padding:10px 12px 12px;background:rgba(10,16,25,.9);border:3px solid #6C5EB5;border-radius:4px}

/* Das Menü erscheint nach einer Sekunde und baut sich ruckelnd auf, wie auf einem alten Heimcomputer */
.mcard.boot{animation:c64in 1.5s steps(1,end) 1s both}
@keyframes c64in{0%{opacity:0;visibility:hidden}12%{opacity:.18;visibility:visible}27%{opacity:.4}36%{opacity:.32}52%{opacity:.6}60%{opacity:.52}78%{opacity:.82}86%{opacity:.74}100%{opacity:1;visibility:visible}}
.mname{display:flex;align-items:center;gap:8px;font-family:"Courier New",Courier,monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#B8C76F}
.mname input{flex:1;min-width:0;min-height:38px;padding:0 9px;border-radius:4px;border:2px solid #6C5EB5;background:#0d1626;font-family:"Courier New",Courier,monospace;font-size:16px;color:#eef3fa}
.note.lg{display:flex;align-items:center;gap:8px;margin:4px 0 0}
.note.lg i{flex:none;width:16px;height:12px;border-radius:2px}
#scores .card{width:min(420px,100%);display:flex;flex-direction:column}
#sc-list{flex:1;min-height:0;max-height:min(62vh,560px);overflow:auto;-webkit-overflow-scrolling:touch}
table.sc th{position:sticky;top:0;background:#0d1626}
table.sc{width:100%;border-collapse:collapse;font-size:13.5px}
table.sc th{text-align:left;font-weight:500;font-size:11.5px;color:var(--mut);padding:3px 4px;border-bottom:1px solid var(--line)}
table.sc td{padding:5px 4px;border-bottom:1px solid rgba(40,57,90,.5);font-family:var(--num);font-size:15px}
table.sc td:nth-child(2){font-family:var(--ui);font-size:14px;word-break:break-word}
table.sc td:nth-child(3){font-weight:700;color:var(--orb)}
#scores,#chal{z-index:860}
.mbtn{display:block;width:100%;text-align:left;margin-top:8px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--pan2)}
.mbtn b{display:block;font-size:16px;font-weight:600}
.mbtn span{display:block;font-size:12.5px;color:var(--mut);line-height:1.3;margin-top:1px}
.mbtn em{float:right;font-style:normal;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:1px 7px;margin-left:8px}
.mbtn:disabled{opacity:.55;cursor:default}
.mbtn:not(:disabled):active{background:#22355a}
.mscreen .mbtn{margin-top:6px;padding:6px 11px;border-radius:4px;border:2px solid #6C5EB5;background:#17253b}
.mscreen .mbtn em{color:#B8C76F;border-color:#B8C76F}
/* Ecke unten rechts auf der Karte: Zeit für MDT und MID, Abwurfknopf für die Säckchen (Wandziel) */
#corner{right:8px;bottom:26px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#timer{padding:5px 10px 6px;text-align:right}
#timer span{display:block;font-size:11px;color:var(--mut);line-height:1.1}
#timer b{font-family:var(--num);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
#mk-drop{display:flex;align-items:center;gap:6px;min-height:52px;padding:0 12px 0 10px;border-radius:14px;border:2px solid #ff7ad9;background:#3a1633;touch-action:manipulation}
#mk-drop b{font-family:var(--num);font-size:24px;font-weight:700}
#mk-drop:active{background:#5a2350}
#mk-drop:disabled{opacity:.45}
#result .big b{font-size:30px;color:var(--orb)}
#result{max-height:calc(100% - 16px);overflow:auto}
#result .sec{margin-top:6px}
#result{width:min(330px,calc(100% - 24px))}
#r-extra .kv span{white-space:normal;line-height:1.2}

<body>

        <div class="langlist" id="lang-list" role="listbox" hidden></div>
      </div>
    </div>
    <div class="hrow">

      </div>
      <button id="btn-set" class="iconbtn" data-ia="settings" aria-label="Einstellungen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <div class="stage">
    <main>

        <div class="num" id="i-agl">0<small>m</small></div>
        <div class="num" id="i-nn">NN –</div>
        <div class="kv" id="row-vario"><i id="i-acc" aria-hidden="true"></i><span>m/s</span><b id="i-vario">0,0</b></div>
        <div class="kv"><span data-i="track">Fahrt</span><b id="i-track">–</b></div>
        <div class="kv tgt" hidden><span id="i-tlbl"></span><b id="i-tdist">–</b></div>
        <div class="kv tgt" hidden><span>→</span><b id="i-tbrg">–</b></div>
        <div class="kv"><span data-i="time">Zeit</span><b id="i-time">0:00:00</b></div>
        <div class="kv"><span data-i="dist">Weg</span><b id="i-dist">0 m</b></div>
        <div class="kv"><span data-i="sand">Sand</span><b id="n-total">–</b></div>
        <div class="kv"><span data-i="fill">Gas</span><b id="i-fill">100 %</b></div>
        <div class="kv gasaid" hidden><span>m³</span><b id="i-gas">–</b></div>
        <div class="kv gasaid" hidden><span>ΔT K</span><b id="i-gast">–</b></div>
      </div>

      <div class="ov card" id="hint" hidden></div>
      <div class="ov card" id="paused" hidden data-i="paused">Pause</div>
      <button class="ov" id="follow" hidden data-i="follow">Ballon folgen</button>
      <div class="ov" id="corner">
        <div class="card" id="timer" hidden><span data-i="tm_left"></span><b id="tm-val">00:00:00</b></div>
        <button id="mk-drop" hidden data-ia="mk_a" aria-label="Säckchen abwerfen"><svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true"><path d="M7 3h8l-1.5 5c4.5 2.5 6.5 7 6.5 11 0 4.5-3.5 7-9 7s-9-2.5-9-7c0-4 2-8.5 6.5-11z" fill="#ff7ad9" stroke="#0a1019" stroke-width="1.5"/><path d="M6.5 8h9" stroke="#0a1019" stroke-width="2"/></svg><b id="mk-n">0</b></button>
      </div>

      <div class="ov card" id="result" hidden>
        <h2 id="r-head"></h2>
        <div class="kv big" id="r-ptsrow" hidden><span data-i="r_pts"></span><b id="r-pts">–</b></div>
        <div id="r-extra"></div>
        <div class="kv" id="r-rankrow" hidden><span data-i="r_rank"></span><b id="r-rank">–</b></div>
        <div class="kv"><span data-i="r_sink">Sinken beim Aufsetzen</span><b id="r-sink">–</b></div>

<script>
/* =====================================================================
   Gasballon-Simulator
   Physik-Kern ohne Bezug zur Oberfläche, damit er sich einzeln prüfen lässt.
   ===================================================================== */
/*CORE-START*/
const R_GAS = 8.314462;      // J/(mol·K)
const M_AIR = 0.028964;      // kg/mol, trockene Luft
const M_H2  = 0.002016;      // kg/mol, Wasserstoff
const G0    = 9.80665;       // m/s²
const CP_H2 = 28.83;         // J/(mol·K), Wärmekapazität von Wasserstoff bei konstantem Druck
const KAPPA = R_GAS / CP_H2; // 0,288: Exponent der adiabatischen Zustandsänderung des Traggases
const SIGMA = 5.670374e-8;   // W/(m²·K⁴), Stefan-Boltzmann-Konstante
const PR    = 0.71;          // Prandtl-Zahl, für Luft und Wasserstoff nahezu gleich
// Stoffwerte, Potenzansätze um 273 K: Wärmeleitfähigkeit W/(m·K) und dynamische Viskosität Pa·s
const kAir = T => 0.0241 * Math.pow(T / 273.15, 0.82), muAir = T => 1.716e-5 * Math.pow(T / 273.15, 0.70);
const kH2  = T => 0.168  * Math.pow(T / 273.15, 0.78), muH2  = T => 8.40e-6  * Math.pow(T / 273.15, 0.69);

const DEFAULT_CFG = {
  vol: 1000,       // Hüllenvolumen in m³ (STE-09)
  rust: 200,       // Rüstmasse in kg: Korb und Ballon, Hülle eingeschlossen (Vorgabe Nutzer, STE-09)
  equip: 30,       // Ausrüstung in kg (Vorgabe Nutzer)
  envKg: 135,      // Masse der Hülle in kg, Teil der Rüstmasse; bestimmt ihre Wärmekapazität (Vorgabe Nutzer)
  pax: 4,          // Personen (STE-10)
  paxKg: 80,       // Masse je Person in kg (STE-10)
  sackKg: 15,      // Masse je Sandsack (STE-13)
  scoopKg: 0.2,    // Masse je Schaufel: 200 g (Vorgabe Nutzer 08.10.2026, STE-14)
  cw: 0.45,        // Widerstandsbeiwert der Hülle, Kugel (Annahme, OP-16)
  envC: 1400,      // J/(kg·K), Wärmekapazität des Hüllenstoffs (Annahme)
  envEps: 0.85,    // Emissionsgrad der Hülle im Infraroten (Annahme)
  valveD: 1.0,     // m, Durchmesser des Parachute-Ventils im Scheitel der Hülle (Vorgabe Nutzer)
  valveCd: 1.0,    // Ausflusszahl des voll geöffneten Ventils (Annahme, OP-16)
  ropeLen: 50,     // m, Länge des Schlepptaus (Vorgabe Nutzer)
  ropeKgM: 0.3,    // kg je Meter: 15 kg auf 50 m (Vorgabe Nutzer); das Tau zählt zur Ausrüstung
  ropeMu: 3.8,     // Reibungsbeiwert des Schlepptaus am Boden (Annahme, OP-28): Bremskraft = ropeMu × Gewicht des aufliegenden Taus.
                   // Reine Gleitreibung von Kokosfaser auf Gras läge bei etwa 0,6 bis 1. Das rund 10 cm dicke, sehr raue Tau pflügt aber durch
                   // den Bewuchs der Felder und bremst um ein Mehrfaches. Abgestimmt auf die Vorgabe: Liegen 40 m auf, steht der Ballon bei 4 m/s Wind fast.
  markKg: 0.07     // kg, ein Säckchen (Marker) für die Aufgabe Wandziel (Vorgabe Nutzer)
};

/* Simulierte Atmosphäre (OP-18, vorläufig fest): Bodenwerte, Temperaturschichten mit Inversion, Wind dreht mit der Höhe.
   Höhen in m über Grund. */
const SIM_WX = {
  p0: 101600, T0: 12,
  layers: [[500,-0.0080],[650,0.0130],[2000,-0.0060],[2150,0.0010],[1e5,-0.0065]],   // [Obergrenze, Gradient K/m]
  wind: [[0,200,2.5],[300,215,4],[600,240,5.5],[1000,265,6],[1500,280,7.5],[2000,300,9],[3000,310,12],[5000,320,18],[10000,320,25]]   // [Höhe, Richtung aus °, m/s]
};
const DZ = 25, ZTOP = 10000;

/* Zufällige simulierte Atmosphäre (MET-06): Bei jedem Start kommt der Wind aus einer anderen Richtung und dreht mit der Höhe
   in unregelmäßigen Abständen und unregelmäßig stark. full: Die Drehung deckt bis 6000 m alle Windrichtungen ab (Aufgabe MID). */
function randomWx(rnd, full){
  rnd = rnd || Math.random;
  const R = (a, b) => a + rnd() * (b - a), SPLIT = 3000;
  // Schichtgrenzen in unregelmäßigen Abständen; unter 3000 m liegen sie dichter, dort wechselt die Richtung häufiger
  const hs = [0]; while (hs[hs.length - 1] < 6000){ const h = hs[hs.length - 1], nx = h + R(100, 280) + rnd() * rnd() * (h < SPLIT ? 700 : 1500); hs.push(h < SPLIT && nx > SPLIT ? SPLIT : Math.min(6000, nx)); }
  const n = hs.length - 1, w = []; let sLo = 0, sHi = 0;
  for (let i = 0; i < n; i++){ const x = (0.15 + rnd() * rnd() * 2.5) * (hs[i + 1] - hs[i]) / 600; w.push(x); if (hs[i] < SPLIT) sLo += x; else sHi += x; }   // Anteil der Drehung je Schicht
  // Drehung vom Boden bis 3000 m: 150° bis 270° (Vorgabe Nutzer: bis 270°); darüber dreht der Wind weiter. Mit full (Aufgabe MID) kommen bis 6000 m alle Richtungen vor.
  const lo = full ? R(230, 270) : R(150, 270), hi = full ? R(130, 170) : R(30, 110), sign = rnd() < 0.75 ? 1 : -1;
  let dir = R(0, 360), spd = R(1.5, 3.5); const pts = [[0, dir, spd]];
  for (let i = 0; i < n; i++){ dir += sign * (hs[i] < SPLIT ? lo * w[i] / sLo : hi * w[i] / sHi); spd = Math.max(1.2, spd + (hs[i + 1] - hs[i]) * R(0.0008, 0.0035) + R(-0.8, 0.8)); pts.push([hs[i + 1], dir, spd]); }
  const wind = [];                                                                                                               // Stützstellen alle 100 m, damit die Drehung gleichmäßig durchlaufen wird
  for (let z = 0; z <= 6000; z += 100){
    let i = 0; while (i < n - 1 && hs[i + 1] < z) i++;
    const q = (z - hs[i]) / (hs[i + 1] - hs[i]);
    wind.push([z, ((pts[i][1] + (pts[i + 1][1] - pts[i][1]) * q) % 360 + 360) % 360, pts[i][2] + (pts[i + 1][2] - pts[i][2]) * q]);
  }
  const top = wind[wind.length - 1]; wind.push([10000, top[1], top[2] * 1.3]);
  const ib = R(250, 1100), it = ib + R(80, 220);                                                                                 // Inversion in zufälliger Höhe
  return {p0: R(100300, 102600), T0: R(6, 18), layers: [[ib, -R(0.006, 0.0095)], [it, R(0.006, 0.016)], [R(1800, 2600), -0.0060], [1e5, -0.0065]], wind};
}

function buildAtm(wx){
  const tab = [];
  let T = wx.T0 + 273.15, p = wx.p0, li = 0, wi = 0;
  for (let z = 0; z <= ZTOP; z += DZ){
    while (wi < wx.wind.length - 2 && wx.wind[wi+1][0] < z) wi++;
    const a = wx.wind[wi], b = wx.wind[wi+1], f = Math.min(1, Math.max(0, (z - a[0]) / (b[0] - a[0])));
    const uv = k => { const d = k[1] * Math.PI / 180; return [-k[2] * Math.sin(d), -k[2] * Math.cos(d)]; };
    const A = uv(a), B = uv(b);
    tab.push({T, p, u: A[0] + (B[0] - A[0]) * f, v: A[1] + (B[1] - A[1]) * f});
    while (wx.layers[li][0] <= z) li++;
    const T2 = T + wx.layers[li][1] * DZ;
    p *= Math.exp(-G0 * M_AIR * DZ / (R_GAS * (T + T2) / 2));   // hydrostatisch
    T = T2;
  }
  return tab;
}
function atmAt(tab, h){
  if (h < 0){                                              // unter der Höhe des Startplatzes (Fahrt ins Tal): Normgradient nach unten, Druck hydrostatisch, Wind wie am Boden
    const a = tab[0], T = a.T - 0.0065 * h;
    return {T, p: a.p * Math.exp(-G0 * M_AIR * h / (R_GAS * (a.T + T) / 2)), u: a.u, v: a.v};
  }
  const x = Math.min(h, ZTOP - 0.001) / DZ, i = Math.floor(x), f = x - i, a = tab[i], b = tab[i+1];
  return {T: a.T + (b.T - a.T) * f, p: a.p + (b.p - a.p) * f, u: a.u + (b.u - a.u) * f, v: a.v + (b.v - a.v) * f};
}

const fixedKg = cfg => cfg.rust + cfg.equip + cfg.pax * cfg.paxKg;   // alles außer Sand und Gas

/* Beladung beim Start (STE-11 bis STE-14, OP-15): Hülle voll, gerade so viel Sand, dass der Ballon steht. */
function loadout(cfg, tab){
  const a = atmAt(tab, 0);
  const n = a.p * cfg.vol / (R_GAS * a.T);              // mol Traggas in der vollen Hülle
  const lift = n * (M_AIR - M_H2);                      // kg: verdrängte Luft minus Gas
  const trim = lift - fixedKg(cfg);                     // kg Trimmballast
  const sU = Math.round(cfg.sackKg * 10);               // Sack in 100-g-Einheiten
  if (trim < 0) return {ok: false, n, lift, trim, sacks: 0, mU: 0};
  let full = Math.floor(trim / cfg.sackKg + 1e-9);
  let restU = Math.round((trim - full * cfg.sackKg) * 10);
  if (restU >= sU){ full++; restU -= sU; }
  // ein Sack liegt beim Start in der Sandmulde (vom Nutzer bestätigt)
  return {ok: true, n, lift, trim, sacks: Math.max(full - 1, 0), mU: (full >= 1 ? sU : 0) + restU};
}
function newBalloon(cfg, tab){
  const Lo = loadout(cfg, tab), a = atmAt(tab, 0);
  return {ok: Lo.ok, h: 0, w: 0, e: 0, n: 0, t: 0, dist: 0, maxH: 0, gas: Lo.n, gas0: Lo.n, Tg: a.T, Tf: a.T,
          sacks: Lo.sacks, mU: Lo.mU, marks: 0, rope: false, ropeOn: 0, gnd: 0, air: false, landed: false, vLand: 0, free: 0, full: true, lift: Lo.lift, trim: Lo.trim};
}
const sandKg = (B, cfg) => B.sacks * cfg.sackKg + B.mU / 10;
/* Nachfüllen (STE-15): weniger als ein Sack in der Mulde und mehr als ein Sack übrig */
function refill(B, cfg){
  const sU = Math.round(cfg.sackKg * 10);
  if (B.mU < sU && B.sacks > 1){ B.sacks--; B.mU += sU; return true; }
  return false;
}
function dropSack(B, cfg){ if (B.landed || B.sacks < 1) return false; B.sacks--; refill(B, cfg); return true; }
function dropScoop(B, cfg){ if (B.landed || B.mU < 1) return false; B.mU -= Math.round(cfg.scoopKg * 10); if (B.mU < 0) B.mU = 0; refill(B, cfg); return true; }

/* Wärmehaushalt des Traggases (STE-19), zwei Knoten: Gas und Hülle.
   Gas ↔ Hülle: freie Konvektion im Inneren, turbulent, Nu = 0,13·Ra^(1/3) (McAdams; für Ballone bei Kreith und Kreider 1974).
   Hülle ↔ Luft: freie Konvektion an der Kugel (Churchill 1983) und erzwungene Konvektion (Whitaker 1972, hier über den
   belegten Bereich hinaus verwendet); angeströmt wird der Ballon nur mit seiner Steig- oder Sinkgeschwindigkeit,
   weil er waagerecht mit dem Wind treibt. Dazu Wärmestrahlung der Hülle; die Umgebung strahlt vereinfacht mit Lufttemperatur.
   Sonneneinstrahlung ist nicht berücksichtigt. Das Gas gilt als durchmischt. */
function heatExchange(B, cfg, a, V, dt){
  if (V <= 0 || B.gas <= 0) return;
  const D = Math.cbrt(6 * V / Math.PI), A = Math.PI * D * D;
  // innen
  const Tgi = (B.Tg + B.Tf) / 2, rhoG = B.gas * M_H2 / V, nuG = muH2(Tgi) / rhoG, alG = kH2(Tgi) / (rhoG * CP_H2 / M_H2);
  const RaI = G0 * Math.abs(B.Tg - B.Tf) / Tgi * D * D * D / (nuG * alG);
  const hI = Math.max(1, 0.13 * Math.cbrt(RaI)) * kH2(Tgi) / D;
  // außen
  const Tfa = (B.Tf + a.T) / 2, rhoA = a.p * M_AIR / (R_GAS * Tfa), nuA = muAir(Tfa) / rhoA, alA = nuA / PR;
  const RaE = G0 * Math.abs(B.Tf - a.T) / Tfa * D * D * D / (nuA * alA);
  const nuFree = 2 + 0.589 * Math.pow(RaE, 0.25) / Math.pow(1 + Math.pow(0.469 / PR, 9 / 16), 4 / 9);
  const Re = Math.abs(B.w) * D / nuA;
  const nuForced = 2 + (0.4 * Math.sqrt(Re) + 0.06 * Math.pow(Re, 2 / 3)) * Math.pow(PR, 0.4);
  const hE = Math.cbrt(nuFree * nuFree * nuFree + nuForced * nuForced * nuForced) * kAir(Tfa) / D;
  const hR = 4 * cfg.envEps * SIGMA * Tfa * Tfa * Tfa;
  const qGas = hI * A * (B.Tf - B.Tg);                 // W, Hülle an Gas
  const qEnv = (hE + hR) * A * (a.T - B.Tf) - qGas;    // W, Umgebung an Hülle abzüglich der Abgabe ans Gas
  B.Tg += qGas * dt / (B.gas * CP_H2);
  B.Tf += qEnv * dt / (Math.max(10, Math.min(cfg.envKg, cfg.rust)) * cfg.envC);
  B.hI = hI; B.hE = hE; B.hR = hR;
}

/* Ein Zeitschritt. valve = 0 bis 1 (wie weit die Ventilleine gezogen ist).
   B.h ist die Höhe über dem Startplatz, B.gnd die Geländehöhe unter dem Ballon, ebenfalls über dem Startplatz (STE-21). */
function stepBalloon(B, cfg, tab, dt, valve){
  if (B.landed || !B.ok) return;
  const a = atmAt(tab, B.h);
  if (valve > 0 && B.gas > 0){
    // Parachute-Ventil im Scheitel: Das Gas strömt durch die Öffnung aus, getrieben vom Überdruck der Gassäule
    // Δp = (ρ_Luft − ρ_Gas)·g·h, Ausströmgeschwindigkeit √(2·Δp/ρ_Gas); die offene Fläche wächst proportional zum Zug
    const rhoG = a.p * M_H2 / (R_GAS * B.Tg), rhoA = a.p * M_AIR / (R_GAS * a.T);
    const hGas = Math.cbrt(6 * Math.min(B.gas * R_GAS * B.Tg / a.p, cfg.vol) / Math.PI);        // Höhe der Gassäule, als Kugel genähert
    const q = cfg.valveCd * valve * Math.PI * cfg.valveD * cfg.valveD / 4 * Math.sqrt(2 * Math.max(0, rhoA - rhoG) * G0 * hGas / rhoG);   // m³/s
    B.gas = Math.max(0, B.gas - q * dt * a.p / (R_GAS * B.Tg));
  }
  let V = B.gas * R_GAS * B.Tg / a.p;
  B.full = V >= cfg.vol;
  if (B.full){ B.gas = a.p * cfg.vol / (R_GAS * B.Tg); V = cfg.vol; }      // pralle Hülle: Überschuss entweicht (STE-05)
  const rho = a.p * M_AIR / (R_GAS * a.T);
  // Schlepptau (STE-20): Hängt es aus und reicht bis zum Boden, trägt der Boden den aufliegenden Teil. Der Ballon wird um
  // dieses Gewicht leichter, je tiefer er sinkt; das fängt das Sinken ab. Die Reibung des Taus bremst die Fahrt über Grund.
  const agl = B.h - B.gnd;                                                 // Höhe über Grund
  B.ropeOn = (B.rope && agl < cfg.ropeLen) ? cfg.ropeKgM * (cfg.ropeLen - Math.max(agl, 0)) : 0;
  const load = fixedKg(cfg) + sandKg(B, cfg) + B.marks * cfg.markKg - B.ropeOn;
  const free = rho * V - B.gas * M_H2 - load;                              // kg Auftriebsüberschuss
  B.free = free;
  if (agl <= 0 && free <= 0.06){                                           // steht am Boden oder ist auf ansteigendes Gelände aufgesetzt
    if (B.air){ B.landed = true; B.vLand = Math.max(0, -B.w); } else B.Tg = B.Tf = a.T;
    B.w = 0; B.acc = 0; B.h = B.gnd; return;
  }
  const area = Math.PI * Math.pow(3 * cfg.vol / (4 * Math.PI), 2 / 3);
  const k = 0.5 * rho * cfg.cw * area;
  const mEff = load + B.gas * M_H2 + 0.5 * rho * V;                        // mit mitbewegter Luft
  B.acc = (G0 * free - k * B.w * Math.abs(B.w)) / mEff;                    // m/s², Vertikalbeschleunigung (Anzeige am Vario)
  B.w += B.acc * dt;
  let h2 = B.h + B.w * dt;
  let u = a.u, v = a.v;
  if (B.ropeOn > 0 || B.lag){
    // Das aufliegende Tau bremst mit ropeMu × Gewicht, entgegen der Fahrt über Grund. Die Luftkraft auf die Hülle zieht den Ballon zum Wind hin.
    // Aus beiden Kräften und der Masse folgt die Fahrt: Der Ballon bremst nicht schlagartig, und reicht der Wind nicht gegen die Reibung, steht er.
    let pu = B.gu || 0, pv = B.gv || 0; const ru = u - pu, rv = v - pv, rel = Math.hypot(ru, rv);
    pu += k * rel * ru / mEff * dt; pv += k * rel * rv / mEff * dt;                                   // Luftkraft
    const s = Math.hypot(pu, pv), s2 = Math.max(0, s - cfg.ropeMu * G0 * B.ropeOn / mEff * dt);     // Reibung des Taus
    if (s > 0){ pu *= s2 / s; pv *= s2 / s; }
    B.lag = B.ropeOn > 0 || Math.hypot(u - pu, v - pv) > 0.05;             // nach dem Abheben des Taus holt der Ballon den Wind wieder ein
    if (B.lag){ u = pu; v = pv; }
  }
  B.gs = Math.hypot(u, v); B.gu = u; B.gv = v;
  B.e += u * dt; B.n += v * dt; B.dist += B.gs * dt; B.t += dt;
  if (h2 <= B.gnd){
    h2 = B.gnd;
    if (B.air){ B.landed = true; B.vLand = Math.max(0, -B.w); }
    B.w = 0;
  }
  const a2 = atmAt(tab, h2);
  B.Tg *= Math.pow(a2.p / a.p, KAPPA);                                     // Gas dehnt sich adiabatisch aus oder wird verdichtet
  heatExchange(B, cfg, a2, V, dt);                                         // Wärmeaustausch Gas, Hülle, Umgebung
  B.h = h2;
  if (B.h > B.maxH) B.maxH = B.h;
  if (B.h - B.gnd > 10) B.air = true;
}

/* ---------- Wettermodell: Open-Meteo, Druckflächen und Bodenwerte für den Startort (MET-01) ---------- */
const WX_LEVELS = [1000, 975, 950, 925, 900, 850, 800, 700, 600, 500, 400, 300, 250];
function wxUrl(lat, lon){
  const h = ['temperature_2m', 'wind_speed_10m', 'wind_direction_10m', 'surface_pressure'];
  WX_LEVELS.forEach(L => ['temperature', 'wind_speed', 'wind_direction', 'geopotential_height'].forEach(v => h.push(v + '_' + L + 'hPa')));
  return 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(4) + '&longitude=' + lon.toFixed(4) + '&hourly=' + h.join(',') + '&wind_speed_unit=ms&timezone=UTC&forecast_days=3';
}
const windUV = (spd, dir) => [-spd * Math.sin(dir * Math.PI / 180), -spd * Math.cos(dir * Math.PI / 180)];
/* Antwort auswerten: alle Stunden ab der laufenden (MET-02). Je Stunde Stützstellen mit Höhe NN, unten der Boden. */
function wxParse(j, nowMs){
  try{
    const H = j.hourly, elev = +j.elevation || 0, tt = H.time.map(t => Date.parse(t + 'Z')), hours = [];
    let k0 = 0; tt.forEach((t, i) => { if (t <= nowMs) k0 = i; });
    for (let k = k0; k < tt.length; k++){
      const g = n => (H[n] && H[n][k] != null) ? +H[n][k] : null, pts = [];
      if (g('temperature_2m') == null || g('wind_speed_10m') == null) continue;
      const uv0 = windUV(g('wind_speed_10m'), g('wind_direction_10m') || 0); pts.push({z: elev, T: g('temperature_2m') + 273.15, u: uv0[0], v: uv0[1]});
      WX_LEVELS.forEach(L => {
        const z = g('geopotential_height_' + L + 'hPa'), T = g('temperature_' + L + 'hPa'), sp = g('wind_speed_' + L + 'hPa'), d = g('wind_direction_' + L + 'hPa');
        if (z != null && T != null && sp != null && d != null && z > elev + 40){ const uv = windUV(sp, d); pts.push({z, T: T + 273.15, u: uv[0], v: uv[1], pl: L * 100}); }   // Flächen unter dem Boden weglassen
      });
      pts.sort((a, b) => a.z - b.z);
      if (pts.length < 4) continue;
      let p0 = g('surface_pressure'); p0 = p0 != null ? p0 * 100 : null;
      if (p0 == null){ const q = pts.find(x => x.pl); p0 = q.pl * Math.exp(G0 * M_AIR * (q.z - elev) / (R_GAS * (pts[0].T + q.T) / 2)); }   // ersatzweise aus der untersten Druckfläche
      hours.push({t: tt[k], p0, pts});
    }
    if (!hours.length) return null;
    return {valid: hours[0].t, elev, hours, lat: +j.latitude, lon: +j.longitude};
  }catch(e){ return null; }
}
/* Tabelle der Atmosphäre für eine Stunde. Höhe 0 der Tabelle ist die Höhe NN des Startplatzes (zref), auch wenn das Wetter von einem
   anderen Ort mit anderer Geländehöhe stammt: Temperatur und Wind linear zwischen den Stützstellen, Druck hydrostatisch vom Bodendruck
   des Wetterorts aus nach oben und nach unten; unter dessen Boden gilt der Normgradient und der Bodenwind. */
function buildAtmFromHour(hr, elev, zref){
  const P = hr.pts, n = Math.floor(ZTOP / DZ) + 1, tab = new Array(n); let i = 0;
  for (let k = 0; k < n; k++){
    const z = zref + k * DZ; let T, u, v;
    if (z <= P[0].z){ T = P[0].T + 0.0065 * (P[0].z - z); u = P[0].u; v = P[0].v; }
    else {
      while (i < P.length - 2 && P[i + 1].z < z) i++;
      const a = P[i], b = P[i + 1];
      if (z <= b.z){ const f = (z - a.z) / (b.z - a.z); T = a.T + (b.T - a.T) * f; u = a.u + (b.u - a.u) * f; v = a.v + (b.v - a.v) * f; }
      else { T = Math.max(216.65, b.T - 0.0065 * (z - b.z)); u = b.u; v = b.v; }                               // über der obersten Fläche
    }
    tab[k] = {T, p: 0, u, v};
  }
  let ks = Math.min(n - 1, Math.max(0, Math.ceil((elev - zref) / DZ)));                                        // erste Tabellenhöhe auf oder über dem Boden des Wetterorts
  const hyd = (p, dz, Ta, Tb) => p * Math.exp(-G0 * M_AIR * dz / (R_GAS * (Ta + Tb) / 2));
  tab[ks].p = hyd(hr.p0, zref + ks * DZ - elev, P[0].T, tab[ks].T);
  for (let k = ks + 1; k < n; k++) tab[k].p = hyd(tab[k - 1].p, DZ, tab[k - 1].T, tab[k].T);
  for (let k = ks - 1; k >= 0; k--) tab[k].p = hyd(tab[k + 1].p, -DZ, tab[k + 1].T, tab[k].T);
  return tab;
}
const lerpTab = (A, B, f) => A.map((a, k) => { const b = B[k]; return {T: a.T + (b.T - a.T) * f, p: a.p + (b.p - a.p) * f, u: a.u + (b.u - a.u) * f, v: a.v + (b.v - a.v) * f}; });
/* Atmosphäre zu einem Zeitpunkt: zwischen den beiden benachbarten Stunden des Wettermodells gemittelt (MET-02). */
function wxTabAt(m, tMs, zref){
  const H = m.hours; m.tabs = m.tabs || []; if (m.zref !== zref){ m.tabs = []; m.zref = zref; }
  const tab = k => m.tabs[k] || (m.tabs[k] = buildAtmFromHour(H[k], m.elev, zref));
  let k = 0; while (k < H.length - 1 && H[k + 1].t <= tMs) k++;
  if (k >= H.length - 1 || tMs <= H[k].t) return tab(k);
  return lerpTab(tab(k), tab(k + 1), (tMs - H[k].t) / (H[k + 1].t - H[k].t));
}

/* ---------- Selbststeuerung: hält eine Sollhöhe mit Sand und Ventil. Für die Zielberechnung und den Vergleichsweg. ---------- */
function dropKg(B, cfg, kg){
  let n = 0; while (kg - n * cfg.sackKg >= cfg.sackKg && B.sacks > 1){ B.sacks--; n++; }
  let u = Math.round((kg - n * cfg.sackKg) * 10);
  while (u > 0){ if (B.mU < 1){ if (B.sacks > 0){ B.sacks--; u -= Math.round(cfg.sackKg * 10); continue; } break; } const d = Math.min(u, B.mU); B.mU -= d; u -= d; refill(B, cfg); }
}
function autopilot(B, cfg, tab, hSoll){
  const a = atmAt(tab, B.h), rho = a.p * M_AIR / (R_GAS * a.T);
  const k = 0.5 * rho * cfg.cw * Math.PI * Math.pow(3 * cfg.vol / (4 * Math.PI), 2 / 3);
  let wSoll;
  if (hSoll <= 0) wSoll = B.h > 200 ? -2 : -(0.5 + 1.5 * B.h / 200);              // Abstieg, kurz vor dem Boden abfangen
  else wSoll = Math.max(-2, Math.min(2.5, (hSoll - B.h) / 60));
  const need = k * wSoll * Math.abs(wSoll) / G0 - B.free;                         // kg, die am Auftriebsüberschuss fehlen (+) oder zu viel sind (−)
  if (B.h <= 0 && !B.air && hSoll > 0){ dropKg(B, cfg, Math.max(need, 2)); return; }
  if (need > 1.2) dropKg(B, cfg, need);
  else if (need < -1.2) B.gas = Math.max(0, B.gas + need / (M_AIR * B.Tg / a.T - M_H2));   // Gas ablassen
}
/* Eine Fahrt nach Plan durchrechnen: legs = [{h, dur}] (Höhe über Grund in m, Dauer in s), danach Landung. */
function planFlight(cfg, tab, legs){
  const B = newBalloon(cfg, tab), path = [[0, 0, 0]], marks = []; if (!B.ok) return {ok: false};
  const sand0 = sandKg(B, cfg); let leg = 0, tEnd = legs[0].dur;
  for (let t = 0; t < 4 * 3600 && !B.landed; t++){
    if (leg < legs.length && t >= tEnd){ marks.push([B.e, B.n, B.h]); leg++; if (leg < legs.length) tEnd += legs[leg].dur; }
    if (t % 10 === 0) autopilot(B, cfg, tab, leg < legs.length ? legs[leg].h : 0);
    stepBalloon(B, cfg, tab, 1, 0);
    if (t % 60 === 59) path.push([B.e, B.n, B.h]);
  }
  path.push([B.e, B.n, 0]);
  return {ok: B.landed, e: B.e, n: B.n, t: B.t, vLand: B.vLand, maxH: B.maxH, sandLeft: sandKg(B, cfg), sand0, gasLeft: B.gas / B.gas0, path, marks};
}
const windDirTo = (tab, h) => { const a = atmAt(tab, h); return (Math.atan2(a.u, a.v) * 180 / Math.PI + 360) % 360; };
const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
/* Ziel für die Aufgabe Zielfahren: Fahrten mit zufälligen Höhenplänen rechnen; der Landepunkt einer passenden Fahrt wird das Ziel.
   Entfernung des Ziels je Stufe (Vorgabe Nutzer): einfach 2 bis 3 km, mittel rund 5 km, schwer rund 10 km. Die Fahrzeit wird so
   lange angepasst, bis der Landepunkt in diesem Bereich liegt.
   level: 0 einfach (eine Höhe), 1 mittel (ein Wechsel der Höhe), 2 schwer (hohe Schicht mit anderer Windrichtung). */
const TARGET_KM = [[2000, 3000], [4000, 6000], [8000, 12000]];
function makeTarget(cfg, tab, level, rnd){
  rnd = rnd || Math.random;
  const pick = arr => arr[Math.floor(rnd() * arr.length)], span = (a, b) => a + rnd() * (b - a);
  const lowE = [150, 200, 300, 400], low = [200, 300, 400, 500, 600, 800], high = [1000, 1200, 1500, 1800];
  const dMin = TARGET_KM[level][0], dMax = TARGET_KM[level][1], dMid = (dMin + dMax) / 2;
  let best = null, lowShear = false, maxLo = 0, maxHi = 0;                 // größte Richtungsänderung, die das Profil hergibt
  for (const a of low) for (const b of low) maxLo = Math.max(maxLo, angDiff(windDirTo(tab, a), windDirTo(tab, b)));
  for (const a of low) for (const b of high) maxHi = Math.max(maxHi, angDiff(windDirTo(tab, a), windDirTo(tab, b)));
  const needMid = Math.min(25, maxLo * 0.7), needHi = Math.min(45, maxHi * 0.7);
  if ((level === 1 && maxLo < 15) || (level === 2 && maxHi < 25)) lowShear = true;
  for (let tries = 0; tries < 14; tries++){
    let hs, fr;                                                            // Höhen der Abschnitte und ihr Anteil an der Fahrzeit
    if (level === 0){ hs = [pick(lowE)]; fr = [1]; }
    else if (level === 1){
      let a, b, n = 0; do { a = pick(low); b = pick(low); } while ((a === b || angDiff(windDirTo(tab, a), windDirTo(tab, b)) < needMid) && ++n < 40);
      const q = span(0.35, 0.65); hs = [a, b]; fr = [q, 1 - q];
    } else {
      let a, b, n = 0; do { a = pick(low); b = pick(high); } while (angDiff(windDirTo(tab, a), windDirTo(tab, b)) < needHi && ++n < 40);
      const q1 = span(0.15, 0.25), q3 = span(0.2, 0.3); hs = [a, b, pick(low)]; fr = [q1, 1 - q1 - q3, q3];
    }
    let su = 0, sv = 0; hs.forEach((h, i) => { const a = atmAt(tab, h); su += fr[i] * a.u; sv += fr[i] * a.v; });
    const vbar = Math.max(0.6, Math.hypot(su, sv)), tLow = 50 * hs.length;   // mittlere Drift über die Abschnitte
    const run = T => { const legs = hs.map((h, i) => ({h, dur: Math.max(40, fr[i] * T)})); return Object.assign(planFlight(cfg, tab, legs), {legs}); };
    let T = Math.min(7200, Math.max(tLow, 0.7 * dMid / vbar)), r = run(T), d = r.ok ? Math.hypot(r.e, r.n) : 0;
    for (let it = 0; it < 3 && r.ok && (d < dMin || d > dMax); it++){      // Fahrzeit nachstellen, bis die Entfernung passt
      const T2 = Math.min(7200, Math.max(tLow, T + (dMid - d) / vbar)); if (Math.abs(T2 - T) < 5) break;
      T = T2; r = run(T); d = r.ok ? Math.hypot(r.e, r.n) : 0;
    }
    if (!r.ok || r.vLand > 1.5) continue;
    const okDist = d >= dMin && d <= dMax, okSand = r.sandLeft >= 0.12 * r.sand0;
    const cand = Object.assign(r, {dist: d, brg: (Math.atan2(r.e, r.n) * 180 / Math.PI + 360) % 360, level, lowShear});
    if (okDist && okSand) return cand;
    if (okSand && (!best || Math.abs(d - dMid) < Math.abs(best.dist - dMid))) best = cand;      // Notlösung: die Fahrt, deren Entfernung der Stufe am nächsten kommt
  }
  return best;
}

/* ---------- Aufgabe Wandziel (AUF-01 bis AUF-03) ----------
   Target Cross: Eine Fahrt in zwei oder drei niedrigen Höhen wird durchgerechnet; die Orte am Ende jedes Abschnitts werden die Kreuze.
   So sind sie mit dem Wind des Tages nacheinander erreichbar. Drei Kreuze gibt es, wenn die unteren Schichten genug Richtungsunterschied
   haben, sonst zwei. Abstand der Kreuze untereinander: 100 m bis 2 km (Vorgabe Nutzer). */
const WZ_R = 100;      // m, Wertungsradius um ein Target Cross (Vorschlag Claude, OP-31)
function makeCrosses(cfg, tab, rnd){
  rnd = rnd || Math.random;
  const pick = arr => arr[Math.floor(rnd() * arr.length)], span = (a, b) => a + rnd() * (b - a), hsAll = [100, 150, 200, 300, 400];
  let maxD = 0; for (const a of hsAll) for (const b of hsAll) maxD = Math.max(maxD, angDiff(windDirTo(tab, a), windDirTo(tab, b)));
  const n = maxD >= 12 ? 3 : 2; let best = null;
  for (let tries = 0; tries < 12; tries++){
    const legs = []; let prev = 0;
    for (let i = 0; i < n; i++){
      let h; do { h = pick(hsAll); } while (h === prev); prev = h;
      const a = atmAt(tab, h), v = Math.max(0.8, Math.hypot(a.u, a.v)), gap = i === 0 ? span(900, 1800) : span(150, 1700);
      legs.push({h, dur: Math.min(1500, Math.max(50, gap / v))});
    }
    const r = planFlight(cfg, tab, legs); if (!r.ok || r.marks.length < n) continue;
    const cr = r.marks.slice(0, n).map(m => ({e: m[0], n: m[1]})); let bad = 0;
    for (let i = 0; i < n; i++) for (let k = i + 1; k < n; k++){ const d = Math.hypot(cr[i].e - cr[k].e, cr[i].n - cr[k].n); if (d < 100) bad += 100 - d; if (k === i + 1 && d > 2000) bad += d - 2000; }
    const cand = {crosses: cr, path: r.path, legs, t: r.t, bad};
    if (!bad) return cand;
    if (!best || bad < best.bad) best = cand;
  }
  return best;
}
/* Fall eines Säckchens: Es fällt mit rund 9 m/s und treibt dabei mit dem Wind der Schichten, durch die es fällt (Annahme, OP-31). */
function markerFall(tab, e, n, h, gnd, vf){
  vf = vf || 9; let z = h;
  while (z > gnd){ const dz = Math.min(10, z - gnd), a = atmAt(tab, z - dz / 2), dt = dz / vf; e += a.u * dt; n += a.v * dt; z -= dz; }
  return [e, n, Math.max(0, h - gnd) / vf];
}
/* Wertung Wandziel (Vorschlag Claude, OP-31): je Kreuz zählt das nächstgelegene Säckchen, 100 Punkte auf dem Kreuz (bis 3 m),
   linear fallend auf 0 am Wertungsradius; die Punktzahl der Fahrt ist der Mittelwert über alle Kreuze. */
const scoreMarker = d => d <= 3 ? 100 : d >= WZ_R ? 0 : 100 * (WZ_R - d) / (WZ_R - 3);
function scoreCrosses(crosses, drops){
  const per = crosses.map(() => ({d: null, p: 0}));
  drops.forEach(q => { const x = per[q.cross]; if (x && (x.d == null || q.d < x.d)){ x.d = q.d; x.p = Math.round(scoreMarker(q.d)); } });
  return {per, pts: Math.round(per.reduce((s, x) => s + (x.d == null ? 0 : scoreMarker(x.d)), 0) / crosses.length)};
}

/* ---------- Aufgabe MDT, Max Distance (AUF-04, AUF-05) ----------
   Bestweite: Fahrten in jeweils einer Höhe über die ganze Zeit werden durchgerechnet, so dass die Landung in der Zeit liegt; die
   weiteste zählt. Das ist die beste Fahrt mit dem Wetter des Startzeitpunkts in gleichbleibender Höhe (Vorschlag Claude, OP-32). */
function bestDistance(cfg, tab, limit){
  let best = null;
  for (const h of [300, 600, 1000, 1500, 2000, 3000, 4000, 5000, 6000]){
    let dur = limit - h / 2 - 240, r = planFlight(cfg, tab, [{h, dur}]);
    if (r.ok && r.t > limit){ dur -= (r.t - limit) + 30; if (dur < 300) continue; r = planFlight(cfg, tab, [{h, dur}]); }
    if (!r.ok || r.t > limit + 60) continue;
    const d = Math.hypot(r.e, r.n); if (!best || d > best.dist) best = Object.assign(r, {dist: d, h});
  }
  return best;
}
/* Wertung MDT: 100 Punkte für die Bestweite, anteilig weniger; je volle Minute über der Zeit ein Punkt Abzug. */
function scoreMdt(d, best, t, limit){
  const base = best > 0 ? Math.round(100 * Math.min(1, d / best)) : 0, pen = t > limit ? Math.floor((t - limit) / 60) : 0;
  return {base, pen, pts: Math.max(0, base - pen)};
}
/* Wertung MID, Min Distance (AUF-06): 100 Punkte bei Landung bis 200 m vom Start; je weitere angefangene 200 m ein Punkt Abzug;
   je volle Minute, die früher oder später als nach der Sollzeit gelandet wird, ein Punkt Abzug. */
function scoreMid(d, t, limit){
  const penD = d <= 200 ? 0 : Math.ceil((d - 200) / 200), penT = Math.floor(Math.abs(t - limit) / 60);
  return {penD, penT, pts: Math.max(0, 100 - penD - penT)};
}
/* Rückmeldung zur Landung nach der Sinkgeschwindigkeit beim Aufsetzen, auf eine Nachkommastelle gerundet (PUN-08, Vorgabe Nutzer). */
const landClass = v => { const x = Math.round(v * 10) / 10; return x <= 0.5 ? 'ld_soft' : x <= 1.5 ? 'ld_sport' : x <= 2.8 ? 'ld_wild' : 'ld_crash'; };

/* ---------- Zielort aus OpenStreetMap (ZIE-04) und Ausschluss sensibler Orte (ZIE-07) ----------
   Rund um den berechneten Landepunkt werden Sportplätze gesucht. Gesperrt ist die Umgebung von Flugplätzen, Krankenhäusern,
   Schulen, Polizei, Feuerwehr, Gefängnissen, Militär, Kraftwerken, Umspannwerken, Bahnhöfen und Gewässern. */
const OSM = {url: 'https://overpass-api.de/api/interpreter', rPlace: 1200, clear: {aero: 2500, sens: 300, water: 150}};
function osmQuery(lat, lon, rP){
  rP = rP || OSM.rPlace;
  const c = lat.toFixed(5) + ',' + lon.toFixed(5), a = '(around:' + Math.round(rP) + ',' + c + ')', b = '(around:' + Math.round(rP + OSM.clear.sens + 100) + ',' + c + ')', d = '(around:' + Math.round(rP + OSM.clear.aero + 100) + ',' + c + ')';
  return '[out:json][timeout:6];(' +
    'nwr["leisure"="pitch"]' + a + ';' +
    'nwr["aeroway"~"^(aerodrome|heliport)$"]' + d + ';' +
    'nwr["amenity"~"^(hospital|clinic|prison|school|kindergarten|police|fire_station)$"]' + b + ';' +
    'nwr["landuse"="military"]' + b + ';nwr["military"]' + b + ';' +
    'nwr["power"~"^(plant|substation)$"]' + b + ';nwr["railway"="station"]' + b + ';' +
    'nwr["natural"="water"]' + b + ';' +
    ');out tags center 400;';
}
function osmClass(t){
  if (!t) return null;
  if (t.aeroway) return 'aero';
  if (t.landuse === 'military' || t.military) return 'sens';
  if (/^(hospital|clinic|prison|school|kindergarten|police|fire_station)$/.test(t.amenity || '')) return 'sens';
  if (/^(plant|substation)$/.test(t.power || '') || t.railway === 'station') return 'sens';
  if (t.natural === 'water') return 'water';
  if (t.leisure === 'pitch') return (t.access === 'private' || t.access === 'no') ? null : 'pitch';
  return null;
}
const mDist = (la1, lo1, la2, lo2) => Math.hypot((la2 - la1) * 111320, (lo2 - lo1) * 111320 * Math.cos(la1 * Math.PI / 180));
/* Aus der Antwort den Zielort wählen: der nächste Sportplatz mit genug Abstand zu allen gesperrten Orten;
   sonst eine Landezone am berechneten Punkt, nötigenfalls von gesperrten Orten weggeschoben (blocked). */
function pickPlace(els, lat, lon, rMax){
  rMax = rMax || OSM.rPlace;                               // Suchradius für den Zielort; bei nahen Zielen kleiner, damit das Ziel nicht weit vom berechneten Punkt abrückt
  const pts = (els || []).map(e => ({lat: e.lat != null ? e.lat : (e.center && e.center.lat), lon: e.lon != null ? e.lon : (e.center && e.center.lon), cls: osmClass(e.tags), name: e.tags && e.tags.name})).filter(x => x.cls && x.lat != null && x.lon != null);
  const excl = pts.filter(x => x.cls !== 'pitch');
  const gap = (la, lo) => { let w = null; for (const x of excl){ const d = mDist(la, lo, x.lat, x.lon), need = OSM.clear[x.cls]; if (d < need && (!w || need - d > w.need - w.d)) w = {x, d, need}; } return w; };
  const pitches = pts.filter(x => x.cls === 'pitch').map(x => Object.assign(x, {d: mDist(lat, lon, x.lat, x.lon)})).filter(x => x.d <= rMax).sort((a, b) => a.d - b.d);
  for (const q of pitches) if (!gap(q.lat, q.lon)) return {kind: 'pitch', lat: q.lat, lon: q.lon, name: q.name || null, blocked: false, clear: true};
  if (!gap(lat, lon)) return {kind: 'zone', lat, lon, name: null, blocked: false, clear: true};
  let la = lat, lo = lon;
  for (let i = 0; i < 8; i++){ const w = gap(la, lo); if (!w) break; if (w.d < 1){ la += 0.0002; continue; } const f = (w.need + 80) / w.d; la = w.x.lat + (la - w.x.lat) * f; lo = w.x.lon + (lo - w.x.lon) * f; }
  return {kind: 'zone', lat: la, lon: lo, name: null, blocked: true, clear: !gap(la, lo)};
}

/* Punkte (PUN-01, PUN-02): Die Landezone ist ein Kreis mit 100 m Radius um das Ziel (Vorgabe Nutzer); wer darin landet, bekommt 100 Punkte.
   Außerhalb fallen die Punkte linear auf 0 am Punkteradius. Der Punkteradius ist 20 % der Entfernung vom Start zum Ziel, mindestens 300 m.
   Harte Landung kostet bis zur Hälfte (vorläufig, OP-05). */
const ZONE_R = 100;                       // m, Radius der Landezone beim Zielfahren
const LAND_SOFT = 1.0, LAND_HARD = 2.9;   // m/s Sinken beim Aufsetzen; ab LAND_HARD gilt die Landung als Bruchlandung (PUN-08)
const scoreRadius = targetDist => Math.max(3 * ZONE_R, 0.2 * targetDist);
function scoreLanding(distM, vLand, targetDist){
  const R = scoreRadius(targetDist), base = distM <= ZONE_R ? 100 : distM >= R ? 0 : 100 * (R - distM) / (R - ZONE_R);
  const f = vLand <= LAND_SOFT ? 1 : vLand >= LAND_HARD ? 0.5 : 1 - 0.5 * (vLand - LAND_SOFT) / (LAND_HARD - LAND_SOFT);
  return Math.round(base * f);
}

const navLang = (() => { const n = (navigator.language || 'en').toLowerCase(); if (n.startsWith('zh')) return 'zh-TW'; const c = n.slice(0, 2); return LANGS.some(l => l[0] === c) ? c : 'en'; })();

const nf = (x, d = 0) => x.toLocaleString(UI.lang, {minimumFractionDigits: d, maximumFractionDigits: d});
const fmtV = v => { if (Math.abs(v) < 0.05) v = 0; return (v >= 0 ? '+' : '−') + nf(Math.abs(v), 1); };
const fmtD = d => d < 1000 ? Math.round(d) + ' m' : nf(d / 1000, 1) + ' km';
const fmtHMS = t => { t = Math.floor(t); return String(Math.floor(t / 3600)).padStart(2, '0') + ':' + String(Math.floor(t / 60) % 60).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const fmtT = t => { t = Math.floor(t); return Math.floor(t / 3600) + ':' + String(Math.floor(t / 60) % 60).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const UNITS = {kmh: [3.6, 'km/h'], kt: [1.943844, 'kt'], ms: [1, 'm/s']};
const spd = v => Math.round(v * UNITS[UI.unit][0]);

const dirTo = (u, v) => (Math.atan2(u, v) * 180 / Math.PI + 360) % 360;
const deg3 = d => String(Math.round(d) % 360).padStart(3, '0') + '°';
const CARD = {de: ['N','NO','O','SO','S','SW','W','NW'], en: ['N','NE','E','SE','S','SW','W','NW'], fr: ['N','NE','E','SE','S','SO','O','NO'], pl: ['N','NE','E','SE','S','SW','W','NW'], cs: ['S','SV','V','JV','J','JZ','Z','SZ'], 'zh-TW': ['北','東北','東','東南','南','西南','西','西北'], es: ['N','NE','E','SE','S','SO','O','NO']};

/* ---------- Ton: im Gerät erzeugt (Web Audio), keine Tondateien ---------- */
const SND = (() => {
  let ctx = null, master = null, buf = null, hiss = null, lastScoop = 0;
  function ensure(){ return UI.sound ? audio() : null; }
  function audio(){
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      try{ ctx = new AC(); }catch(e){ return null; }
      master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
      buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function noise(o){   // Rauschen durch ein Filter, das von f0 nach f1 gleitet
    const c = ensure(); if (!c) return; const t = c.currentTime + (o.at || 0);
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7; f.frequency.setValueAtTime(o.f0, t); f.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + o.dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.peak, t + (o.attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random()); src.stop(t + o.dur + 0.05);
  }
  function tone(o){
    const c = ensure(); if (!c) return; const t = c.currentTime + (o.at || 0);
    const os = c.createOscillator(); os.type = o.type || 'sine'; os.frequency.setValueAtTime(o.f0, t); os.frequency.exponentialRampToValueAtTime(o.f1 || o.f0, t + o.dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.peak, t + (o.attack || 0.008)); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    os.connect(g); g.connect(master); os.start(t); os.stop(t + o.dur + 0.05);
  }
  /* Musik im Hauptmenü: frei erfundenes Stück im Klang der Heimcomputer der 80er.
     Drei Stimmen (Melodie und gebrochene Akkorde als Rechteck, Bass als Dreieck) und Schlagzeug aus Rauschen. */
  const SONG = {
    bpm: 124,
    chords: [[57,60,64],[53,57,60],[55,60,64],[55,59,62],[57,60,64],[53,57,60],[55,59,62],[56,59,64]],
    bass: [45, 41, 48, 43, 45, 41, 43, 40],
    lead: [[69,0,72,76,0,74,72,0],[69,0,72,77,0,76,72,69],[67,0,72,76,0,79,76,0],[74,0,71,67,0,71,74,0],[76,0,81,79,76,0,72,74],[77,0,81,77,72,0,69,72],[74,0,79,74,71,0,67,71],[76,0,71,68,71,76,80,0]]
  };
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  let mus = null;
  function mNote(type, f, t, dur, peak){
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    const g = ctx.createGain(); g.gain.setValueAtTime(peak, t); g.gain.setValueAtTime(peak, t + dur * 0.65); g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(mus.g); o.start(t); o.stop(t + dur + 0.02); return o;
  }
  function mNoise(t, dur, peak, hp){
    const src = ctx.createBufferSource(); src.buffer = buf; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = ctx.createGain(); g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(mus.g); src.start(t, Math.random()); src.stop(t + dur + 0.02);
  }
  function mStep(i, t){
    const S = mus.S, bar = Math.floor(i / 16) % 8, st = i % 16;
    if (st % 2 === 0){
      const n = SONG.lead[bar][st / 2]; if (n){ const o = mNote('square', hz(n), t, S * 1.8, 0.13); o.frequency.setValueAtTime(hz(n) * 1.007, t + S * 0.9); }
      mNote('triangle', hz(SONG.bass[bar] + (st % 4 === 0 ? 0 : 12)), t, S * 1.7, 0.22);
      mNote('square', hz(SONG.bass[bar] + 24), t, S * 1.2, 0.03);                                // Bass eine Lage höher mitspielen: Handy-Lautsprecher geben tiefe Töne kaum wieder
    }
    const ch = SONG.chords[bar], a = mNote('square', hz(ch[0] + 12), t, S, 0.05);                 // gebrochener Akkord, drei Töne je Sechzehntel
    a.frequency.setValueAtTime(hz(ch[1] + 12), t + S / 3); a.frequency.setValueAtTime(hz(ch[2] + 12), t + 2 * S / 3);
    if (st === 0 || st === 8 || (st === 10 && bar % 2)){ const o = ctx.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.11); const g = ctx.createGain(); g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14); o.connect(g); g.connect(mus.g); o.start(t); o.stop(t + 0.16); }
    if (st === 4 || st === 12) mNoise(t, 0.12, 0.14, 1800);
    if (st % 4 === 2) mNoise(t, 0.035, 0.05, 7000);
  }
  function music(on){
    if (!on || !UI.music){
      if (mus){ clearInterval(mus.timer); const g = mus.g; g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setTargetAtTime(0, ctx.currentTime, 0.08); setTimeout(() => { try{ g.disconnect(); }catch(e){} }, 600); mus = null; }
      return;

/* ---------- Wetter laden (MET-01 bis MET-03, MET-06) ---------- */
async function loadWx(lat, lon, useCache){
  const kmTo = c => Math.hypot((c.lat - lat) * 111.32, (c.lon - lon) * 111.32 * Math.cos(lat * Math.PI / 180));
  try{
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 12000);
    const r = await fetch(wxUrl(lat, lon), {signal: ac.signal}); clearTimeout(to);
    if (!r.ok) throw new Error('http ' + r.status);
    const m = wxParse(await r.json(), Date.now()); if (!m) throw new Error('parse');
    if (useCache) store.set('gb-wx2', {lat, lon, at: Date.now(), m});
    return m;
  }catch(e){
    if (!useCache) return null;
    const c = store.get('gb-wx2', null);                                  // ohne Netz: zuletzt geladenes Wetter, wenn es nah und frisch genug ist
    if (c && c.m && c.m.hours && kmTo(c) < 20 && Date.now() - c.at < 6 * 3600e3){ c.m.cached = true; return c.m; }
    return null;
  }
}

  WX.place = null;
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 5000);
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=12&lat=' + WX.lat.toFixed(4) + '&lon=' + WX.lon.toFixed(4) + '&accept-language=' + encodeURIComponent(UI.lang), {signal: ac.signal});
    if (r.ok){ const j = await r.json(), a = j.address || {}; WX.place = a.village || a.town || a.city || a.municipality || a.hamlet || a.suburb || j.name || null; }
  }catch(e){}
  finally{ clearTimeout(to); }
}
function wxWhereText(){
  const de = (WX.lon - START.lon) * klon(), dn = (WX.lat - START.lat) * KLAT, d = Math.hypot(de, dn), brg = (Math.atan2(de, dn) * 180 / Math.PI + 360) % 360;
  return [WX.place, tr('sw_wx_at', {dist: nf(d / 1000, 1), card: card(brg)})].filter(Boolean).join(', ');        // Entfernung immer in km, auch wenn der Gitterpunkt nah am Startplatz liegt
}

/* ---------- Gelände (STE-21): Höhenmodell von Open-Meteo als Raster um den Ballon, beim Fahren wird nachgeladen ---------- */
const TER = {on: false, base: null, grid: null, fine: null, busy: 0, failAt: 0, fineAt: 0, N: 10, step: 2000, fstep: 400};   // 10 × 10 Punkte: grob alle 2 km, fein alle 400 m
function terUrl(ce, cn, step){
  const la = [], lo = [], h = (TER.N - 1) / 2;
  for (let j = 0; j < TER.N; j++) for (let i = 0; i < TER.N; i++){ const q = ll(ce + (i - h) * step, cn + (j - h) * step); la.push(q[0].toFixed(5)); lo.push(q[1].toFixed(5)); }
  return 'https://api.open-meteo.com/v1/elevation?latitude=' + la.join(',') + '&longitude=' + lo.join(',');
}
async function terLoad(ce, cn, fine){
  const key = fine ? 2 : 1; if (TER.busy & key) return; TER.busy |= key;
  const step = fine ? TER.fstep : TER.step, ac = new AbortController(), to = setTimeout(() => ac.abort(), 8000);
  try{
    const r = await fetch(terUrl(ce, cn, step), {signal: ac.signal}); if (!r.ok) throw new Error('http ' + r.status);
    const z = (await r.json()).elevation; if (!Array.isArray(z) || z.length !== TER.N * TER.N || z.some(v => !isFinite(v))) throw new Error('daten');

  const x = Math.min(TER.N - 1.001, Math.max(0, (e - g.e0) / g.step)), y = Math.min(TER.N - 1.001, Math.max(0, (n - g.n0) / g.step));

  return (z(i, j) * (1 - fx) + z(i + 1, j) * fx) * (1 - fy) + (z(i, j + 1) * (1 - fx) + z(i + 1, j + 1) * fx) * fy;
}

function terCheck(){
  if (!TER.on || !TER.grid || Date.now() - TER.failAt < 15000) return;
  const sp = Math.hypot(B.gu || 0, B.gv || 0) || 1, ue = (B.gu || 0) / sp, un = (B.gv || 0) / sp;
  if (!terIn(TER.grid, B.e, B.n, 1.2 * TER.step)) terLoad(B.e + ue * 2.5 * TER.step, B.n + un * 2.5 * TER.step, false);        // grobes Raster voraus in Fahrtrichtung
  // feines Raster nur, wenn der Ballon dem Gelände nahe ist (unter 800 m), und höchstens alle 2 Sekunden
  if (B.h - B.gnd < 800 && !terIn(TER.fine, B.e, B.n, 1.2 * TER.fstep) && Date.now() - TER.fineAt > 2000){ TER.fineAt = Date.now(); terLoad(B.e + ue * 2.5 * TER.fstep, B.n + un * 2.5 * TER.fstep, true); }
}

const osmSeen = new Map();

async function placeTarget(){
  for (let attempt = 0; attempt < 2; attempt++){
    const p = ll(TARGET.e, TARGET.n), rP = Math.max(250, Math.min(OSM.rPlace, 0.15 * TARGET.dist)); let els;
    try{ els = await osmFetch(p[0], p[1], rP); }catch(e){ TARGET.place = {kind: 'zone', name: null, unchecked: true}; return; }
    const r = pickPlace(els, p[0], p[1], rP);
    if (r.blocked && attempt < 1){ const t2 = makeTarget(CFG, ATM, UI.level); if (t2){ TARGET = t2; continue; } }   // Landepunkt liegt an einem gesperrten Ort: einmal ein anderes Ziel rechnen

/* ---------- Vertikalprofil: Höhe, Temperatur mit Schichtung, Wind als Windfähnchen ---------- */
/* Windfähnchen wie in meteorologischen Diagrammen: Der Schaft zeigt dorthin, woher der Wind kommt;
   kurzer Strich 5 kt, langer Strich 10 kt, Dreieck 50 kt; Kreis bei Windstille. */
function drawBarb(c, x, y, fromRad, kt, L){
  c.save(); c.translate(x, y); c.strokeStyle = c.fillStyle = '#4cc9ff'; c.lineWidth = 1.5; c.lineCap = 'round';
  if (kt < 2.5){ c.beginPath(); c.arc(0, 0, 4, 0, 7); c.stroke(); c.restore(); return; }
  c.rotate(fromRad);
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -L); c.stroke(); c.beginPath(); c.arc(0, 0, 1.8, 0, 7); c.fill();
  let n = Math.round(kt / 5); const tri = Math.floor(n / 10); n -= tri * 10; const full = Math.floor(n / 2), half = n % 2, bl = L * 0.5;
  let py = -L;
  for (let i = 0; i < tri; i++){ c.beginPath(); c.moveTo(0, py); c.lineTo(bl, py + 1.5); c.lineTo(0, py + 4.5); c.closePath(); c.fill(); py += 5.5; }
  for (let i = 0; i < full; i++){ c.beginPath(); c.moveTo(0, py); c.lineTo(bl, py - 2.5); c.stroke(); py += 3.5; }
  if (half){ if (!full && !tri) py += 3.5; c.beginPath(); c.moveTo(0, py); c.lineTo(bl / 2, py - 1.25); c.stroke(); }
  c.restore();
}
function drawProf(){

  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
  const top = Math.min(9000, Math.max(2000, Math.ceil((B.h + 300) / 1000) * 1000));
  const zb = Math.min(0, Math.floor(Math.min(B.gnd, B.h) / 500) * 500);                 // Unterkante: tiefer als der Startplatz, wenn es ins Tal geht
  const pt = 22, pb = 18, y = z => H - pb - (z - zb) / (top - zb) * (H - pt - pb), wide = W >= 120;
  const xL = 27, xS = xL + 2, xT0 = xS + 7, xT1 = Math.max(xT0 + 14, W - (wide ? 62 : 50)), xA = W - (wide ? 40 : 33), xN = W - 15, bL = wide ? 18 : 14;

  let Tmin = 1e9, Tmax = -1e9;
  for (let z = zb; z <= top; z += 50){ const T = atmAt(ATM, z).T; Tmin = Math.min(Tmin, T); Tmax = Math.max(Tmax, T); }
  const xT = T => xT0 + (T - Tmin) / Math.max(1, Tmax - Tmin) * (xT1 - xT0);
  let bandTop = -1, labelled = false;

    else if (bandTop >= 0){ if (!labelled){ labelled = true; c.fillStyle = '#9fdcff'; c.font = small; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillText(tr(wide ? 'inv' : 'inv_s'), xT0 + 1, y(bandTop) - 3); } bandTop = -1; }
    c.fillStyle = col[k]; c.fillRect(xS, y(z + 50), 4, y(z) - y(z + 50) + .5);
  }

  for (let z = zb; z <= top; z += stepZ){ c.strokeStyle = 'rgba(154,171,196,.18)'; c.lineWidth = 1; c.beginPath(); c.moveTo(xS + 5, y(z) + .5); c.lineTo(W - 4, y(z) + .5); c.stroke(); c.fillStyle = '#9aabc4'; c.fillText(z, xL - 2, y(z)); }

  c.textAlign = 'right'; c.fillText('m', xL - 2, 13); c.textAlign = 'left'; c.fillText('T', xT0, 13); c.textAlign = 'right'; c.fillText(UNITS[UI.unit][1], W - 4, 13);
  // Wind

  for (let z = zb + (stepW >= 250 ? stepW / 2 : stepW); z < top; z += stepW){
    const a = atmAt(ATM, z), sp = Math.hypot(a.u, a.v);

    c.font = num; c.fillStyle = '#eef3fa'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(spd(sp), xN, y(z));
  }
  // Gelände unter dem Ballon, wenn es höher liegt als der Startplatz
  if (B.gnd > zb + 3){ c.fillStyle = 'rgba(169,132,63,.45)'; c.fillRect(xS + 5, y(Math.min(B.gnd, top)), W - xS - 9, y(zb) - y(Math.min(B.gnd, top))); }
  // Ballon
  const yb = y(Math.min(Math.max(B.h, zb), top));
  c.strokeStyle = '#ff9f1c'; c.lineWidth = 2; c.beginPath(); c.moveTo(xS + 5, yb); c.lineTo(W - 4, yb); c.stroke();
  const xb = xT(atmAt(ATM, B.h).T);
  if (B.rope){ c.strokeStyle = '#d9b36c'; c.lineWidth = 2; c.beginPath(); c.moveTo(xb, yb); c.lineTo(xb, y(Math.max(zb, B.gnd, Math.min(B.h, top) - CFG.ropeLen))); c.stroke(); }   // Schlepptau
  c.fillStyle = '#ff9f1c'; c.beginPath(); c.arc(xb, yb, 5, 0, 7); c.fill(); c.strokeStyle = '#0a1019'; c.lineWidth = 1.5; c.stroke();
}

/* ---------- Online-Dienst (SRV-02 bis SRV-04): vorbereitet, aber abgeschaltet, solange keine Adresse eingetragen ist ----------
   Mit einer Adresse meldet die App jede gewertete Fahrt an den Dienst, holt die gemeinsame Bestenliste dort ab und meldet
   Besuch und Nutzungsdauer. Schnittstelle (IF-09): ?action=top (GET) liefert bis zu 100 Einträge {n, p, c, l, s, at};

const ONLINE = {api: ''};                                  // zum Beispiel 'https://example.org/gasballon/api.php'
const uid = () => { let u = store.get('gb-uid', null); if (!u){ u = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); store.set('gb-uid', u); } return u; };   // zufällige Kennung des Geräts, kein Name
async function onlineCall(action, body){
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 6000);
  try{
    const r = await fetch(ONLINE.api + '?action=' + action, body ? {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(body), signal: ac.signal} : {signal: ac.signal});
    if (!r.ok) throw new Error('http ' + r.status); return await r.json();

/* ---------- Hauptmenü: bewegtes Bild im Stil der Heimcomputer der 80er, Ballon von der Seite ---------- */
const RETRO = (() => {
  const cv = $('c64'); let W = 160, H = 100, c = null, t = 0, acc = 0, sand = [], puffs = [];
  const P = {sky: '#352879', lb: '#6C5EB5', wh: '#FFFFFF', ye: '#B8C76F', re: '#9A6759', br: '#6F4F25', gr: '#588D43', lg: '#9AD284', gy: '#959595', bk: '#000000', cy: '#70A4B2'};
  const clouds = [[20, 0.10, 26], [95, 0.22, 34], [150, 0.05, 20], [60, 0.34, 22]];
  const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  function size(){ const r = cv.getBoundingClientRect(); if (!r.width || !r.height) return false; H = Math.max(90, Math.round(W * r.height / r.width)); if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; } c = cv.getContext('2d'); c.imageSmoothingEnabled = false; return true; }
  function balloon(bx, by){                                  // by: Mitte der Hülle; der Korbboden liegt 20 Bildpunkte darunter
    for (let dy = -10; dy <= 10; dy++){ const hw = Math.round(Math.sqrt(100 - dy * dy)); px(bx - hw, by + dy, hw * 2, 1, P.ye);
      for (const sx of [-6, -2, 2, 6]) if (Math.abs(sx) + 1 <= hw) px(bx + sx - 1, by + dy, 1, 1, P.re); }
    for (let i = 0; i < 4; i++){ const hw = 6 - i; px(bx - hw, by + 10 + i, hw * 2, 1, i % 2 ? P.re : P.ye); }                      // Füllansatz
    for (let i = 0; i < 6; i++){ px(bx - 6 + i * 0.5, by + 10 + i, 1, 1, P.gy); px(bx + 5 - i * 0.5, by + 10 + i, 1, 1, P.gy); }  // Leinen
    px(bx - 3, by + 16, 6, 4, P.br); px(bx - 3, by + 16, 6, 1, P.wh); px(bx - 4, by + 17, 1, 2, P.ye); px(bx + 3, by + 17, 1, 2, P.ye);   // Korb mit Sandsäcken
  }
  function draw(dt){
    if (!size()) return; t += dt;
    // Der Ballon steht zuerst unten links am Boden, wirft Sand ab und steigt; oben lässt er Gas ab und sinkt wieder. Dabei treibt er langsam nach rechts.
    const ground = H - 20, yBot = ground - 20, yTop = 14, T = 18;
    const ph = (t % T) / T, by = yBot - (yBot - yTop) * (0.5 - 0.5 * Math.cos(2 * Math.PI * ph));
    const bx = Math.round((42 + 3.2 * t) % (W + 40)) - 20;
    px(0, 0, W, H, P.sky);
    for (const cl of clouds){ const cx = ((cl[0] - t * 3) % (W + 60) + W + 60) % (W + 60) - 30, cy = cl[1] * H; px(cx, cy, cl[2], 4, P.wh); px(cx + 4, cy - 3, cl[2] - 10, 3, P.wh); px(cx + 2, cy + 4, cl[2] - 6, 2, P.lb); }
    for (let x = 0; x < W; x += 2){ const hh = 6 + Math.round(5 * Math.sin((x + t * 8) / 17) + 3 * Math.sin((x + t * 8) / 7)); px(x, ground - hh, 2, hh, P.gr); }   // Hügel ziehen vorbei
    px(0, ground, W, H - ground, P.lg); for (let x = 0; x < W; x += 8) px((x - t * 14 % 8 + 8) % W, ground + 4 + (x % 3) * 4, 3, 1, P.gr);
    if (ph < 0.12 || ph > 0.94){ for (let i = 0; i < 2; i++) sand.push({x: bx - 4 + Math.random() * 2, y: by + 19, v: 6 + Math.random() * 6}); }
    if (ph > 0.44 && ph < 0.54 && Math.random() < 0.6) puffs.push({x: bx - 2 + Math.random() * 4, y: by - 11, a: 1});
    sand = sand.filter(q => (q.y += q.v * dt, q.v += 60 * dt, q.y < ground + 2)); for (const q of sand) px(q.x, q.y, 1, 1, P.ye);
    puffs = puffs.filter(q => (q.y -= 9 * dt, q.a -= dt * 0.9, q.a > 0)); for (const q of puffs) px(q.x, q.y, 2, 1, P.wh);
    balloon(bx, Math.round(by));
  }
  return { tick(real){ acc += real; if (acc < 1 / 15) return; draw(acc); acc = 0; }, reset(){ t = 0; acc = 0; sand = []; puffs = []; } };   // 15 Bilder je Sekunde
})();

/* ---------- Zeitschleife ---------- */
let lastTs = 0;
function frame(ts){
  const real = Math.min(0.1, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if (STATE === 'menu' || STATE === 'scores' || STATE === 'chal'){ RETRO.tick(real); requestAnimationFrame(frame); return; }
  if (STATE === 'play' && !PAUSED && !B.landed && B.ok){
    B.gnd = terAt(B.e, B.n); terCheck(); wxTick();
    let simDt = real * (valve > 0 ? 1 : UI.speed);                    // solange das Ventil gezogen ist, läuft die Zeit 1×
    while (simDt > 1e-6 && !B.landed){ const d = Math.min(0.25, simDt); stepBalloon(B, CFG, ATM, d, valve); simDt -= d; if (TER.on) B.gnd = terAt(B.e, B.n); }
    if (Math.hypot(B.e - lastPathE, B.n - lastPathN) > 25){ lastPathE = B.e; lastPathN = B.n; pathPts.push(ll(B.e, B.n)); if (pathPts.length > 4000) pathPts = pathPts.filter((p, i) => i % 2 === 0 || i > pathPts.length - 200); pathLine.setLatLngs(pathPts); }
    const p = ll(B.e, B.n); balMk.setLatLng(p); if (follow && B.h > B.gnd && ts > introUntil) followView(p);
    if (B.landed && !shown){ shown = true; pathPts.push(p); pathLine.setLatLngs(pathPts); showResult(); }
  }
  updInst(); drawProf();
  requestAnimationFrame(frame);
}

const CF = {vol: 'c-vol', rust: 'c-rust', envKg: 'c-env', equip: 'c-equip', pax: 'c-pax', paxKg: 'c-paxkg'};
function cfgFill(){ for (const k in CF) $(CF[k]).value = CFG[k]; cfgCalc(); }
function cfgRead(){ const c = Object.assign({}, CFG); for (const k in CF){ const el = $(CF[k]), v = parseFloat(String(el.value).replace(',', '.')); if (isFinite(v)) c[k] = Math.min(+el.max, Math.max(+el.min, k === 'pax' ? Math.round(v) : v)); } return c; }
function cfgCalc(){
  const c = cfgRead(), Lo = loadout(c, ATM), box = $('cfg-calc'); box.classList.toggle('bad', !Lo.ok);
  box.textContent = Lo.ok ? tr('calc', {lift: nf(Lo.lift, 1), trim: nf(Lo.trim, 1), sacks: Lo.sacks, mulde: nf(Lo.mU / 10, 1)}) : tr('calc_bad', {lift: nf(Lo.lift, 1), load: nf(fixedKg(c))});
}
for (const k in CF) $(CF[k]).addEventListener('input', cfgCalc);
$('cfg-apply').addEventListener('click', async () => {
  const running = STATE === 'play' || STATE === 'brief' || STATE === 'done';
  if (running && !(await confirmBox(tr('cf_restart'), tr('cf_restart_ok')))) return;      // Rückfrage: neu starten oder abbrechen
  CFG = cfgRead(); store.set('gb-cfg2', {vol: CFG.vol, rust: CFG.rust, envKg: CFG.envKg, equip: CFG.equip, pax: CFG.pax, paxKg: CFG.paxKg}); cfgFill(); openSheet(false);
  if (running) prepareRun(); else B = newBalloon(CFG, ATM);
});
$('cfg-reset').addEventListener('click', () => { for (const k in CF) $(CF[k]).value = DEFAULT_CFG[k]; cfgCalc(); });

(function initLang(){
  const list = $('lang-list'), btn = $('lang-btn'), close = () => { list.hidden = true; btn.setAttribute('aria-expanded', 'false'); };

  try{ if ('serviceWorker' in navigator){ for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope.endsWith('/spiel/') || r.scope === new URL('./', location.href).href) await r.unregister(); }
       if (window.caches){ for (const k of await caches.keys()) if (k.startsWith('gb-shell')) await caches.delete(k); } }catch(e){}

});
/* ---------- Installation als App (INS-04) ----------
   Android und Chrome am Rechner melden mit beforeinstallprompt, dass sich die App installieren lässt; „Installieren“ öffnet dann den Dialog des Browsers.
   iPhone und iPad kennen das nicht: Dort zeigt der Hinweis die Schritte in Safari. „Später“ blendet den Hinweis für 7 Tage aus. In der installierten App erscheint er nicht. */
const INSTALL = (() => {
  let ev = null, steps = false, forced = false;
  const ua = navigator.userAgent || '';
  const ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /android/i.test(ua);
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const snoozed = () => Date.now() < store.get('gb-inst-later', 0);
  const possible = () => !standalone() && (!!ev || ios || android);
  function show(){
    const on = possible() && (forced || (STATE === 'menu' && !snoozed()));
    $('install').hidden = !on; $('inst-set').hidden = !possible();
    if (!on) return;
    $('inst-d').textContent = steps ? tr(ios ? 'inst_ios' : 'inst_other') : tr('inst_d');
    $('inst-ok').hidden = steps; $('inst-later').textContent = tr(steps ? 'close' : 'inst_later');
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; steps = false; show(); });
  window.addEventListener('appinstalled', () => { ev = null; forced = false; show(); toast(tr('inst_done')); });
  $('inst-ok').addEventListener('click', async () => {
    if (ev){ const e = ev; ev = null; try{ e.prompt(); await e.userChoice; }catch(x){} forced = false; store.set('gb-inst-later', Date.now() + 7 * 864e5); show(); }
    else { steps = true; show(); }
  });
  $('inst-later').addEventListener('click', () => { store.set('gb-inst-later', Date.now() + 7 * 864e5); steps = false; forced = false; show(); });
  $('inst-set').addEventListener('click', () => { forced = true; steps = !ev; openSheet(false); show(); });
  return { show };
})();
INSTALL.show();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast(tr('toast_newver')); had = true; });
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', {scope: './', updateViaCache: 'none'}).then(r => r.update()).catch(() => {}); });
}
